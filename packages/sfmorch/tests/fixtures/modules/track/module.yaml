name: FakeTracker
version: 1.0.0
kind: tracking
summary: Chains pairwise correspondences into tracks by feature index. Test fixture only.

image: sfm-fixture:1.0.0
resources: {gpu: false}

consumes:
  scene: {type: scene/v1, required: true}
  pairs: {type: pairwise_matches/v1, required: true}
produces:
  tracks: {type: tracks/v1}

params:
  min_track_len:
    type: integer
    default: 2
    minimum: 2
    maximum: 10
    description: Minimum observations for a track to be kept.
    tuning: >
      Raising this improves the MEAN by deleting short tracks while making the
      underlying problem worse. Judge alongside track_count, not on its own.

metrics:
  track_count:
    direction: higher_better
    healthy: [10, null]
    meaning: Tracks surviving the length filter.
  avg_track_length:
    direction: higher_better
    healthy: [3.0, null]
    meaning: Mean observations per track.
  long_track_fraction:
    direction: higher_better
    healthy: [0.3, null]
    meaning: Fraction of tracks seen in 3+ views.
  min_frame_observations:
    direction: higher_better
    healthy: [4, null]
    meaning: Observations in the weakest frame.
  frames_covered:
    direction: higher_better
    healthy: [1.0, null]
    meaning: Fraction of frames carrying an observation.
  inconsistent_rate:
    direction: lower_better
    healthy: [null, 0.05]
    meaning: Tracks observed twice in one frame.
  trifocal_transfer_px:
    direction: lower_better
    nullable: true
    meaning: Held-out three-view transfer error; null in this fixture.
  trifocal_samples:
    direction: higher_better
    meaning: Observations behind it.
  trifocal_triples:
    direction: higher_better
    nullable: true
    meaning: Frame triples used. Null on this fixture, which measures no transfer.
  split_rate:
    direction: lower_better
    healthy: [null, 0.1]
    meaning: Tracks that coincide with another track; the dual of inconsistent_rate.
  max_track_length:
    direction: neutral
    meaning: Longest surviving track.
  track_survival_5:
    direction: higher_better
    healthy: [0.0, null]
    meaning: Fraction of tracks seen in 5+ views.
  track_survival_10:
    direction: higher_better
    healthy: [0.0, null]
    meaning: Fraction of tracks seen in 10+ views.

diagnostics:
  - code: too_few_tracks
    severity: warn
    message: Fewer than 10 tracks survived; reconstruction will fail.
    suggested_actions:
      - Raise the detector's max_keypoints.
      - Check the matcher's inlier_yield before tuning anything here.
    see_also: tuning.md#track_count-below-10
