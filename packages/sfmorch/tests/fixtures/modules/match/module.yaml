name: FakeMatcher
version: 1.0.0
kind: matching
summary: Matches consecutive images by keypoint index. Test fixture only.

image: sfm-fixture:1.0.0
resources: {gpu: false}

consumes:
  scene: {type: scene/v1, required: true}
  features: {type: features/v1, required: true}
produces:
  pairs: {type: pairwise_matches/v1}

params:
  keep_ratio:
    type: number
    default: 1.0
    minimum: 0.0
    maximum: 1.0
    description: Fraction of candidate correspondences retained per pair.
    tuning: >
      Lower values simulate a weak matcher. Inlier yield below ~0.15 is the
      signal that downstream track survival is a MATCHING problem, not a
      tracking one.

metrics:
  inlier_yield:
    direction: higher_better
    healthy: [0.15, null]
    meaning: Retained correspondences over candidates.
  matches_per_pair:
    direction: higher_better
    healthy: [8, null]
    meaning: Mean correspondences per image pair.
  pairs_proposed:
    direction: neutral
    meaning: Pairs the pairing offered, before any survived.
  pairs_matched:
    direction: higher_better
    healthy: [1, null]
    meaning: Consecutive pairs that produced any correspondence.
  min_matches_per_pair:
    direction: higher_better
    healthy: [8, null]
    meaning: The weakest surviving pair.
  inlier_ratio:
    direction: higher_better
    healthy: [0.5, null]
    meaning: Fixture correspondences are exact, so this is keep_ratio by construction.
  graph_components:
    direction: lower_better
    healthy: [null, 1]
    meaning: Connected components of the consecutive-pair chain.
  largest_component_fraction:
    direction: higher_better
    healthy: [1.0, null]
    meaning: Fraction of images in the biggest component.
  min_image_degree:
    direction: higher_better
    healthy: [2, null]
    meaning: >
      Fewest surviving pairs on any one image -- the margin graph_components does
      not report. A consecutive chain puts its end images at degree 1 by
      construction.
  cycle_merge_rate:
    direction: lower_better
    nullable: true
    meaning: >
      Three-view chains landing on different scene structure than the direct
      match. Null on this fixture: a consecutive chain closes no triple.
  cycle_split_rate:
    direction: lower_better
    nullable: true
    meaning: >
      The same test at a couple of pixels -- one point detected twice. Null here
      for the same reason.
  planarity:
    direction: lower_better
    healthy: [null, 0.7]
    meaning: Not measured by this fixture, which is what the null is for.

diagnostics:
  - code: weak_matching
    severity: warn
    message: Inlier yield is below 0.15; tracking downstream will be starved.
    suggested_actions:
      - Raise the detector's max_keypoints.
      - Loosen this module's keep_ratio.
    metric: inlier_yield
    see_also: tuning.md#inlier_yield-below-015
