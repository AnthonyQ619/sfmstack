type: scene_analysis/v1
summary: Cues characterizing a scene before any reconstruction runs, plus derived traits.

description: |
  Every file group is OPTIONAL. This is the type that most exercises the
  additive-extension rule: a cheap CPU extractor fills `photometric`, `texture`
  and `metadata`; a GPU extractor fills `motion` and `degeneracy`; a new
  extractor adds arrays nobody has thought of yet. Partial producers compose
  without a merge step because the agent reads whichever groups are present.

  Only widely-agreed cues are declared here. Anything else a producer computes
  rides along as an extra array and is recorded in the manifest under `extras`,
  which is exactly the intended behaviour -- promote a cue into this schema once
  more than one module relies on it.

  Traits are the retrieval key: they match the `scene_traits` frontmatter on
  worked runs, so "find scenes like this one" is a set intersection rather than a
  judgment call. Traits are DERIVED BY THE ORCHESTRATOR from these numbers using
  thresholds held in skills/judgment/, not computed here -- revising a threshold
  must not cost a GPU hour.

files:
  metadata:
    required: false
    description: Free. EXIF, ordering, and file structure -- no pixels involved.
    arrays:
      n_images: {required: true, shape: [], dtype: [int32, int64]}
      ordered:
        required: false
        shape: []
        dtype: [bool]
        description: |
          Whether filenames or timestamps establish a capture order. Everything
          downstream that matches consecutive pairs assumes this and nothing
          currently checks it.
      capture_interval_s:
        required: false
        shape: []
        dtype: [float32, float64]
        description: Median timestamp delta. Small values imply video frames.
      focal_35mm:
        required: false
        shape: [null]
        dtype: [float32, float64]
        description: Per-image EXIF focal length, for sanity-checking calibration.

  motion:
    required: false
    description: From dense optical flow, normalized by image diagonal.
    arrays:
      overall_magnitude: {required: false, shape: [], dtype: [float32, float64]}
      high_motion_tail: {required: false, shape: [], dtype: [float32, float64]}
      variability: {required: false, shape: [], dtype: [float32, float64]}
      low_baseline_risk: {required: false, shape: [], dtype: [float32, float64]}
      # `large_motion_risk` was declared here and was cut 2026-08-14. It was
      # `mean(pair_p90 > threshold)` -- `high_motion_tail` with a cut point
      # welded into it -- and the cut point fired on all ten benchmark scenes
      # measured, every one of which reconstructs. A declared cue that no
      # producer fills is worse than an absent one, so it is gone from the
      # vocabulary rather than left optional-and-unused. Producers that want to
      # express the same thing write the per-pair series and let the reader
      # threshold it.
      rotation_median_deg: {required: false, shape: [], dtype: [float32, float64]}
      large_rotation_risk: {required: false, shape: [], dtype: [float32, float64]}

  photometric:
    required: false
    description: Illumination, colour, and exposure stability across the set.
    arrays:
      illumination_change: {required: false, shape: [], dtype: [float32, float64]}
      color_shift: {required: false, shape: [], dtype: [float32, float64]}
      exposure_shift: {required: false, shape: [], dtype: [float32, float64]}
      combined_change: {required: false, shape: [], dtype: [float32, float64]}

  texture:
    required: false
    arrays:
      density: {required: false, shape: [], dtype: [float32, float64]}
      repetitiveness:
        required: false
        shape: []
        dtype: [float32, float64]
        description: |
          Self-similarity. High values defeat descriptor matching in a way no
          parameter recovers -- the signal that says switch capability rather
          than tune.
      textureless_fraction: {required: false, shape: [], dtype: [float32, float64]}
      sharpness:
        required: false
        shape: [null]
        dtype: [float32, float64]
        description: Per-image Laplacian variance; identifies frames worth dropping.

  degeneracy:
    required: false
    description: The two classic SfM killers, both detectable before anything runs.
    arrays:
      pure_rotation_risk:
        required: false
        shape: []
        dtype: [float32, float64]
        description: No parallax means no structure, however good the matcher is.
      planar_dominance:
        required: false
        shape: []
        dtype: [float32, float64]
        description: |
          GRIC homography-vs-fundamental preference. High values make
          essential-matrix decomposition ill-conditioned.

  description:
    required: false
    description: |
      ASSERTED, NOT MEASURED -- the only group here that is. Everything else in
      this type comes out of an algorithm reading pixels; this comes out of
      someone LOOKING at the images and answering a rubric. Read it that way: it
      can be wrong in ways a measurement cannot, and it can see things no
      measurement here does -- a person walking through frame, a mirror, whether
      the empty half of the picture is sky you never wanted or a wall you did.

      `overall` is the field to act on -- a paragraph, and the thing a reader
      should weigh alongside the measured groups when choosing a pipeline. The
      rest of the answers are its machine-readable shadow: they make a hazard
      countable and a diagnostic possible, and they do not carry the reasoning.

      Only two arrays are declared, deliberately. The rubric behind this group is
      expected to be revised from experience, and a schema that churns with it
      would drag every producer along. The rest of the answers ride as extras and
      are recorded in the manifest under `extras`; promote one here once it has
      stopped moving. One has already been cut, below.
    arrays:
      overall:
        required: true
        shape: []
        dtype: [str]
        description: One paragraph. What this scene is and what will be hard about it.
      environment: {required: false, shape: [], dtype: [str]}
      # `capture_style` was declared here -- turntable / orbit / walk_along /
      # sweep / aerial / unordered -- and was cut 2026-08-15. It was asserting
      # what `rotation_median_deg`, `variability`, `overall_magnitude` and
      # `metadata.ordered` already measure between them. A declared cue that no
      # producer fills is worse than an absent one, so it is out of the
      # vocabulary rather than left optional-and-unused.

  traits:
    required: false
    description: Derived vocabulary. The retrieval key.
    arrays:
      names:
        required: true
        shape: [null]
        dtype: [str]
        description: e.g. [outdoor, repetitive-texture, planar-dominant, sequential]
