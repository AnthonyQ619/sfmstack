type: dense_model/v1
summary: A dense reconstruction -- point cloud and optionally per-view depth.

description: |
  Terminal for most pipelines. Depth maps are optional and only expressible here
  when every view shares a resolution; producers with ragged depth should write a
  `depth` sidecar in their native format and leave the array out rather than
  padding, which would silently corrupt downstream metrics.

  A `.ply` sidecar is conventional for viewing and for external evaluation
  tooling.

files:
  points:
    required: true
    arrays:
      xyz:
        required: true
        shape: [null, 3]
        dtype: [float32, float64]
      rgb:
        required: false
        shape: [null, 3]
        dtype: [uint8]
      normals:
        required: false
        shape: [null, 3]
        dtype: [float32, float64]

  depth:
    required: false
    description: Only when all views share a resolution.
    arrays:
      maps:
        required: true
        shape: [null, null, null]
        dtype: [float32, float64]
        description: (num_views, height, width). Non-finite marks invalid depth.
      image_index:
        required: true
        shape: [null]
        dtype: [int32, int64]
      confidence:
        required: false
        shape: [null, null, null]
        dtype: [float32, float64]

invariants:
  - check: nonempty
    args: {file: points, array: xyz}
  - check: finite
    args: {file: points, array: xyz}

# Required of every dense reconstructor -- MVS and feed-forward depth alike.
metrics:
  point_count:
    direction: higher_better
    meaning: Points in the dense cloud, after whatever filtering the module applies.

  views_contributing:
    direction: higher_better
    meaning: >
      Images that contributed at least one surviving point. A dense method that
      silently drops half the views produces a cloud that looks fine and covers
      half the scene.

  mean_depth_confidence:
    direction: higher_better
    nullable: true
    meaning: >
      Mean of the module's own confidence, normalised to 0-1. Null for methods
      that produce no confidence. Self-reported and not cross-comparable between
      methods -- read it WITHIN a method, across settings.
