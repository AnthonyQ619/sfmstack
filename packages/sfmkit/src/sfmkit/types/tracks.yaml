type: tracks/v1
summary: Multi-view feature tracks as a flat observation table.

description: |
  One row per observation: a track seen in five views occupies five rows. This is
  the form triangulation and bundle adjustment both want, and it is what the old
  PointsMatched.data_matrix already was -- promoted here to a type of its own so
  a consumer no longer has to guess whether it was given tracks or pairs.

  Produced either by merging pairwise_matches (union-find) or directly from
  images by a learned tracker (VGGSfM, TAPIR). Both routes land on this type,
  which is what lets the driving agent swap between them without touching
  anything downstream.

files:
  observations:
    required: true
    arrays:
      obs:
        required: true
        shape: [null, 4]
        dtype: [float32, float64]
        columns: [track_id, frame_idx, x, y]
        description: |
          Coordinates are in RESIZED image pixels; multiply by scene scale for
          original-resolution values. track_id is dense in [0, track_count).
      track_count:
        required: true
        shape: []
        dtype: [int32, int64]
      visibility:
        required: false
        shape: [null]
        dtype: [float32, float64]
        description: |
          Per-observation confidence, when the tracker reports one. Learned
          trackers do; union-find over verified matches does not.

invariants:
  - check: finite
    args: {file: observations, array: obs}
  - check: max_plus_one_equals
    args:
      file: observations
      array: obs
      column: 0
      scalar: track_count
  - check: values_within
    args: {file: observations, array: obs, column: 1, minimum: 0}

# Required of every tracker, whether it chains pairwise matches (union-find) or
# predicts tracks directly (Tapir, VGGSfM). A track table is judged by its length
# distribution, its frame coverage and its self-consistency regardless of how it
# was built.
metrics:
  track_count:
    direction: higher_better
    meaning: >
      Tracks surviving the module's filters. Incremental SfM needs hundreds to
      seed reliably.

  avg_track_length:
    direction: higher_better
    meaning: >
      Mean observations per track. 2.0 means nothing merged beyond a single pair,
      which is a view-graph problem rather than a tracker one.

  long_track_fraction:
    direction: higher_better
    meaning: >
      Fraction of tracks seen in 3+ views. These are the only tracks constraining
      pose beyond one pair, so this matters more than the mean.

  min_frame_observations:
    direction: higher_better
    meaning: >
      Observations in the weakest frame. A frame below the registration floor
      drops out of the reconstruction whatever the totals say.

  inconsistent_rate:
    direction: lower_better
    meaning: >
      Fraction of tracks observed twice in the same image, i.e. built from
      contradictory correspondences. Detects OVER-merging only; it is structurally
      blind to one physical point being split across several tracks. Read it with
      split_rate, which is the other half.

  split_rate:
    direction: lower_better
    meaning: >
      Fraction of tracks that coincide with another track -- one physical point
      spread across several tracks, the failure inconsistent_rate cannot see. The
      dual of that metric, and the two trade against each other through whatever
      merge tolerance the module applies: merge more loosely and splitting falls
      while inconsistency rises. Either number alone describes half an operating
      point.

      Computed by sfmkit.split_rate at a tolerance FIXED by this type rather than
      chosen per module, because the whole purpose is comparison across trackers,
      and it requires coincidence in at least two distinct frames -- on a dense
      detector, two distinct keypoints within two pixels in one view is ordinary,
      and the same pair landing together in two views is not.

      A union-find tracker's split_rate reads its view graph: a fragmented graph
      leaves one point in several disconnected chains. A predictive tracker's
      reads its query frames, which re-find each other's points.

  trifocal_transfer_px:
    direction: lower_better
    nullable: true
    meaning: >
      Median HELD-OUT three-view transfer error, in pixels at working resolution.
      The only measurement of positional accuracy available at this stage, and the
      only metric here that is not about length, coverage or self-consistency.

      WHAT ONE PIXEL IS. One measurement is one observation of one track in one
      image: the tracker says the point is at (x, y) there, and three-view geometry
      fitted from OTHER tracks says it should be at (x', y'). The measurement is the
      Euclidean distance between those two, in that image's pixels at the scene's
      working resolution -- so 2.5 means "the tracker's positions sit two and a half
      pixels from where the rest of the table says they belong", and halving the
      working resolution roughly halves the reading for an unchanged tracker. The
      metric is the median over every such held-out measurement.

      Computed by sfmkit.trifocal_transfer: for sampled frame triples, the relative
      pose of two views and the position of the third are fitted from HALF the
      common tracks, and the other half's points are then predicted into the third
      view and measured there. Nothing about a measured track's third-view
      observation took part in the fit.

      Three views rather than two on purpose. A matcher verifies pairs
      independently, so a chaining tracker's observations satisfy every epipolar
      constraint by construction and a two-view residual would read zero for that
      family and meaningfully for the others -- a metric of one family, not a
      comparison. Three lines meeting pairwise need not meet at a point, and that
      is the error which survives pairwise verification.

      Null on an uncalibrated scene, and null when no frame triple shares enough
      tracks -- which is itself a statement about the track table.

      COMPARABLE ACROSS TRACKERS ON ONE SCENE, which is what it is for. NOT
      comparable across scenes or across image counts: the absolute value depends
      on the baselines of the sampled triples, and a wider-baseline set transfers
      less accurately for reasons that have nothing to do with the tracker.

      It does NOT see an error consistent across every view of a track: the fitted
      geometry absorbs that. Three views absorb far less than two, which is the
      gain, but it is not immunity.

      IT IS ALSO A WEAKER GUARD ON A NOISIER TRACKER, which is measured rather than
      supposed. Used to detect a merge tolerance wide enough to fuse distinct
      points, a rising reading predicted a worse reconstruction on all three
      ground-truth scenes for the precise tracker and on none of them for the noisy
      one. The mechanism is the metric's own: it works by seeing geometry that no
      longer closes, and a tracker several pixels off has geometry that does not
      close well to begin with, so the signal sits inside its own floor. Read this
      metric as a guard where it is SMALL, and not where it is large.

      Bounded cost by construction -- the triples and the correspondences per
      triple are both capped -- so it does not grow with the scene. Measured at
      0.07-0.7 s on 8- and 20-image sets, reported per run as trifocal_seconds.

      AND IT IS NOT STABLE ACROSS DIFFERENT TRACK TABLES, WHICH IS THE COMPARISON
      MOST READERS ACTUALLY MAKE. Two runs of the same recipe return byte-identical
      values -- the seed is fixed. But comparing two matcher settings with one
      tracker changes the table underneath the sample: a triple is skipped unless
      enough tracks are common to all three of its frames, so a sparser table
      qualifies FEWER TRIPLES, and the per-triple sample is drawn from whatever is
      common. READ trifocal_triples BEFORE COMPARING TWO MEDIANS.

      WHETHER A DIFFERENCE IS REAL. The uncertainty of this reading is set by how
      many measurements it is a median of, and that is computable from what is
      already published here:

          SE  ~=  1.14 * trifocal_transfer_px / sqrt(trifocal_samples)

      A median's standard error is 1.253*sigma/sqrt(n); the residual spread was
      measured across 86 runs spanning a 55x range of medians and came out a
      near-constant 0.615 of the median (sd 0.066), which is what collapses the
      expression to the median and the sample count. Worked: 1.406 over 947
      samples is +/-0.052, and 1.504 over 621 is +/-0.069, so a gap of 0.098
      between two trackers is about ONE standard error and settles nothing. Two
      readings that differ by less than roughly three times this are the same
      reading.

      AND CHECK trifocal_triples BEFORE COMPARING AT ALL. The medians are over
      whichever triples each run could form, so two runs with different
      trifocal_triples are medians of different populations and the standard error
      above does not bridge them -- one capture read 1.46 on 3 triples and 1.71 on
      12 from the same tracker, which looks like a regression and is a change of
      denominator. Compare runs at equal trifocal_triples, or not at all. A
      dispersion figure was tried here and removed: it is predictable from the
      median and says nothing about which triples were drawn, which is the part
      that actually varies.

  trifocal_triples:
    direction: higher_better
    nullable: true
    meaning: >
      How many frame triples the measurement used, of the twelve it attempts. Read
      it every time you read the median, because it is what says whether two
      medians are the same kind of claim.

      TWELVE IS THE ORDINARY VALUE and most runs reach it. Anything materially
      below means the track table did not have enough three-view structure to fill
      the sample: triples are skipped when too few tracks are common to all three
      frames. Readings at 1, 4 and 5 triples have all been produced in normal use,
      and a one-triple reading is ONE PAIR OF BASELINES -- a fact about two
      viewpoints, not a summary of the capture.

      WHY THIS MATTERS MORE THAN THE SPREAD OF THE RESIDUALS. The obvious way to
      ask "is this difference real" is to look at how scattered the individual
      errors are. That is the wrong instrument twice over. It is nearly useless on
      its own -- measured across 86 runs spanning a 55x range of medians and three
      trackers, the residual dispersion was a near-constant 0.62 of the median with
      a standard deviation of 0.07, so it is predictable from the median and adds
      no information. And it answers a question nobody is asking: the uncertainty
      of a MEDIAN is far smaller than the spread of the values it summarises.

      The uncertainty that actually limits a cross-configuration comparison is
      WHICH TRIPLES WERE DRAWN. Two runs with different triple counts sampled
      different baselines, and baselines transfer at different accuracies for
      reasons that have nothing to do with the tracker. A comparison between a
      twelve-triple reading and a five-triple one is not a comparison of trackers
      or settings; it is partly a comparison of viewpoints.

      SO: equal triple counts, compare the medians. Unequal, and materially so,
      treat the difference as unresolved and find another reading -- one such
      comparison was cited as confirming a mechanism when the two runs had twelve
      triples against five, and the mechanism turned out to rest on a direct
      structural measurement instead.


  track_survival_5:
    direction: higher_better
    meaning: >
      Fraction of tracks seen in 5+ views. The survival curve at its second point;
      long_track_fraction is the same measurement at 3.

# Deliberately NOT required, though the predecessor reported them: "Fragmentation"
# (tracks per observation) and "Obs. per Track". The second is avg_track_length
# under another name and the first is its exact reciprocal, so requiring them adds
# two numbers and no information -- and three names for one measurement is worse
# than one, because a reader comparing two modules has to work out they agree.
#
# Also deliberately NOT required, and removed after review:
#   track_survival_10 -- necessarily 0 on any set of fewer than 10 images, which is
#     every reference run in this repository. A metric that is constant across the
#     cases you actually have is not informative, and track_survival_5 already
#     carries the tail of the survival curve.
#   max_track_length -- a single order statistic of a distribution already
#     described by its mean, its median and two survival points. It remains a
#     module-specific metric of FeatureTrackUnionFind, where a track longer than
#     the view graph can support is that module's over-merge signal; nothing else
#     at this stage has a use for it.
#   frames_covered -- the weaker half of a pair. It fires only when a frame is
#     COMPLETELY empty, and min_frame_observations reports that same case as 0
#     while also catching the frame that is merely thin: 12 observations will fail
#     registration as surely as 0 will, and only one of the two metrics sees it.
#     The thin_frame diagnostic already keys on the minimum, not on the fraction.
#     What is lost is HOW MANY frames are empty rather than that one is, which is
#     recoverable from the observation table and was never acted on.
