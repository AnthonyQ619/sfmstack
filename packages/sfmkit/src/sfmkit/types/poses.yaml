type: poses/v1
summary: Camera poses, one per registered image.

description: |
  Cam-from-world 3x4 [R|t], matching COLMAP and OpenCV convention.

  `valid` is required rather than implied by array length: incremental pipelines
  routinely fail to register some images, and a pipeline that silently treats an
  unregistered camera as identity produces a reconstruction that looks plausible
  and is wrong. Making the flag mandatory forces every consumer to confront it.

  Intrinsics may be present when the pose estimator also estimated them (VGGT,
  MapAnything). When present they supersede scene/v1 calibration for downstream
  stages.

files:
  poses:
    required: true
    arrays:
      cam_from_world:
        required: true
        shape: [null, 3, 4]
        dtype: [float32, float64]
        description: World-to-camera rigid transform per image.
      valid:
        required: true
        shape: [null]
        dtype: [bool]
        description: False where the image could not be registered.
      image_index:
        required: true
        shape: [null]
        dtype: [int32, int64]
        description: Index into scene/v1 images.

  intrinsics:
    required: false
    description: Present when this module estimated intrinsics rather than reading them.
    arrays:
      K:
        required: true
        shape: [null, 3, 3]
        dtype: [float32, float64]
      camera_index:
        required: false
        shape: [null]
        dtype: [int32, int64]

invariants:
  - check: same_length
    args: {file: poses, arrays: [cam_from_world, valid, image_index]}
  - check: values_within
    args: {file: poses, array: image_index, minimum: 0}

# Required of every pose estimator, geometric or feed-forward.
#
# The set is deliberately small. A module that recovers poses from correspondences
# can report reprojection error; VGGT and MapAnything predict poses from pixels
# with no correspondence set to measure against, and demanding it of them would
# force either a fabricated number or a second type. It is required-but-nullable
# instead, which makes "this estimator cannot self-assess" a fact the agent reads
# off the artifact rather than an absence it has to infer.
metrics:
  registered_fraction:
    direction: higher_better
    meaning: >
      Fraction of scene images given a pose. Below 1.0 some images have none, and
      every consumer must honour the `valid` array rather than the pose block.

  registered_images:
    direction: higher_better
    meaning: >
      Absolute count. The metric that catches a reconstruction which stalled:
      error can IMPROVE as images drop out, because a smaller model is an easier
      one, so error is never comparable across differing counts.

  mean_reprojection_error:
    direction: lower_better
    nullable: true
    meaning: >
      Mean pixel error at working resolution over whatever observations the module
      used. Null for feed-forward estimators, which have no correspondences to
      measure against -- that null is informative and must not be faked.

  median_reprojection_error:
    direction: lower_better
    nullable: true
    meaning: >
      Median pixel error, beside the mean. The predecessor reported both and the
      pair is what separates "a few bad observations" from "everything is off":
      mean much larger than median is outliers, the two together is a systematic
      problem. Null wherever mean_reprojection_error is null.
