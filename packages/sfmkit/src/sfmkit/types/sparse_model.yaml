type: sparse_model/v1
summary: A sparse reconstruction -- 3D points, their observations, and camera poses.

description: |
  Replaces the old Scene(sparse=True) and IncrementalSfMState, which were two
  representations of the same thing distinguished only by which module made them.

  The npz payload is ALWAYS authoritative. A COLMAP-backed producer additionally
  writes a `colmap` sidecar (cameras/images/points3D.bin) so a pycolmap consumer
  can open the reconstruction natively instead of rebuilding it from arrays. This
  is what replaces the live `Scene.recon` pointer -- previously the only
  unserializable handoff in the pipeline, and the reason the whole thing had to
  run in one process.

  A consumer without pycolmap reads the npz and loses nothing but convenience.

files:
  points:
    required: true
    arrays:
      xyz:
        required: true
        shape: [null, 3]
        dtype: [float32, float64]
      rgb:
        required: false
        shape: [null, 3]
        dtype: [uint8]
      error:
        required: false
        shape: [null]
        dtype: [float32, float64]
        description: Mean reprojection error per point, in pixels.
      track_id:
        required: false
        shape: [null]
        dtype: [int32, int64]
        description: The tracks/v1 track each point came from, when applicable.

  observations:
    required: true
    arrays:
      obs:
        required: true
        shape: [null, 4]
        dtype: [float32, float64]
        columns: [frame_idx, point_index, x, y]
        description: Which image saw which 3D point, and where.

  poses:
    required: true
    arrays:
      cam_from_world:
        required: true
        shape: [null, 3, 4]
        dtype: [float32, float64]
      valid:
        required: true
        shape: [null]
        dtype: [bool]
      image_index:
        required: true
        shape: [null]
        dtype: [int32, int64]

  # EVERY producer of this type emits, in addition to its own metrics:
  #   min_frame_points, two_view_fraction, p95_reprojection_error,
  #   p05_triangulation_angle
  # Ray-intersection producers add median_triangulation_angle beside the p05.
  #
  # They are properties of the ARTIFACT rather than of the process that made it,
  # which is why they belong here and not to one module. Each exists because a
  # scalar that the type already published was concealing something a reader
  # needed: registered_images cannot see a posed camera with no structure,
  # mean_track_length cannot see a bimodal track-length distribution, and a mean
  # reprojection error cannot see the tail that produced it.
  #
  # `p05_triangulation_angle` is required of REFINERS too -- the modules that
  # take this type and return it -- and not only of the modules that place points
  # in the first place. Two reasons, and both are about the consumer rather than
  # the producer. A bundle adjustment moves structure, so the conditioning of the
  # model it was handed is stale the moment it finishes. And a refined model is
  # normally the LAST artifact of this type in a pipeline, so it is the one a
  # dense stage reads: if the refiners omit the reading, the question "how
  # well-determined is this geometry" has no answer at the only point where
  # anything is about to be built on it.
  #
  # `mean_reprojection_error` is the PER-POINT mean on every producer. Three
  # different populations were once published under that one name -- points,
  # observations, and a frame that was not published at all -- and the spread ran
  # to 3.5x, which is enough to invert a head-to-head comparison between two
  # producers. An observation mean weights long tracks, and long tracks are the
  # higher-error points, so it reads worse than the model is. The cross-check
  # that catches a recurrence is free: a bundle adjuster's
  # `reprojection_error_before` must equal the producing module's
  # `mean_reprojection_error` on the same artifact.

  intrinsics:
    required: false
    description: |
      Present when this module estimated or refined intrinsics rather than
      reading them. Added additively: a producer that only triangulates omits the
      file, and a consumer that finds it should prefer it over scene/v1
      calibration, because a bundle adjustment that refined K did so jointly with
      the poses in the same file and the two cannot be mixed with an older K.

      Observations are in UNDISTORTED pixels throughout this type, so there is no
      distortion array here. A producer that works in distorted pixels would be
      changing the meaning of `observations`, not adding to it.
    arrays:
      K:
        required: true
        shape: [null, 3, 3]
        dtype: [float32, float64]
      camera_index:
        required: false
        shape: [null]
        dtype: [int32, int64]
        description: Which camera each image used. Absent means one camera per image.

invariants:
  - check: finite
    args: {file: points, array: xyz}
  - check: nonempty
    args: {file: points, array: xyz}
  - check: finite
    args: {file: observations, array: obs}
  - check: values_within
    args: {file: observations, array: obs, column: 1, minimum: 0}
  - check: same_length
    args: {file: poses, arrays: [cam_from_world, valid, image_index]}

# Required of every producer of a sparse model: triangulators, bundle adjusters,
# COLMAP's mappers, and the feed-forward reconstructors alike.
#
# These describe the ARTIFACT, not the process. A bundle adjuster's interesting
# numbers are before/after; a triangulator's are yield and rejection counts;
# neither is comparable to the other. What is comparable is what came out, which
# is what a consumer choosing between two sparse models actually needs.
metrics:
  point_count:
    direction: higher_better
    meaning: Surviving 3D points.

  observation_count:
    direction: higher_better
    meaning: >
      Total 2D observations across all points. Read with point_count: the ratio is
      mean track length, and a large cloud of two-view points is weaker than a
      small one with deep tracks.

  mean_reprojection_error:
    direction: lower_better
    nullable: true
    meaning: >
      Mean pixel error at working resolution. Null only for a producer with no
      observation set of its own. Not comparable between models with different
      camera counts.

  registered_images:
    direction: higher_better
    meaning: >
      Cameras carrying a valid pose in this model. The predecessor's "Num Camera
      Poses", and the metric that catches a reconstruction which stalled: error can
      IMPROVE as cameras drop out, because a smaller model is an easier one, so
      point_count and error are never comparable across differing counts.

# Deliberately NOT required, and removed after review: mean_track_length. It is
# EXACTLY observation_count / point_count, both of which are required, so it added
# a third name for a quantity already fully determined by two others. Producers
# that route on it -- the two triangulators pick between themselves by it, and
# bundle adjustment warns on it -- still report it as a module-specific metric.
