type: pairwise_matches/v1
summary: Two-view correspondences between image pairs.

description: |
  One half of what the old PointsMatched conflated. That class was simultaneously
  a pairwise container, a multi-view track container, and an observation registry
  reconciling the two; every consumer branched on which half happened to be
  populated. They are separate types here: this one, and tracks/v1.

  `feature_index` is optional because detector-free matchers have no global
  feature table to index into. Its absence is exactly the signal a consumer needs
  to know it is looking at pair-local correspondences.

files:
  pairs:
    required: true
    arrays:
      image_pair:
        required: true
        shape: [null, 2]
        dtype: [int32, int64]
        columns: [image_i, image_j]
        description: |
          The image pairs that were matched. Not assumed consecutive -- a view
          graph from retrieval or exhaustive matching is equally valid here.

  matches:
    required: true
    arrays:
      xy:
        required: true
        shape: [null, 4]
        dtype: [float32, float64]
        columns: [x1, y1, x2, y2]
        description: Correspondence coordinates in each image of the pair.
      pair_index:
        required: true
        shape: [null]
        dtype: [int32, int64]
        description: Row in pairs/image_pair this match belongs to.
      feature_index:
        required: false
        shape: [null, 2]
        dtype: [int32, int64]
        columns: [feature_i, feature_j]
        description: |
          Indices into features/v1 keypoints. Present for detector-based
          matchers, absent for LoFTR/RoMa. Track builders use this when present
          and fall back to coordinate merging when not.
      confidence:
        required: false
        shape: [null]
        dtype: [float32, float64]

invariants:
  - check: same_length
    args: {file: matches, arrays: [xy, pair_index]}
  - check: finite
    args: {file: matches, array: xy}
  - check: values_within
    args: {file: matches, array: pair_index, minimum: 0}

# Required of every matcher. These describe the VIEW GRAPH and its quality, which
# is what makes a brute-force matcher, an approximate one, a learned one and a
# detector-free one comparable at this stage.
metrics:
  pairs_matched:
    direction: higher_better
    meaning: >
      Pairs that survived min_matches. Read against the pairing policy: a
      sequential window and an exhaustive sweep are not the same denominator.

  matches_per_pair:
    direction: higher_better
    meaning: >
      Mean surviving matches per kept pair. Rises when the matcher is permissive
      as readily as when it is good, so never read it without inlier_ratio.

  min_matches_per_pair:
    direction: higher_better
    meaning: >
      The weakest kept pair. A pair at the floor is a hinge in the view graph and
      the likeliest place for the reconstruction to break.

  inlier_ratio:
    direction: higher_better
    meaning: >
      Fraction of matches consistent with the estimated two-view geometry, over
      kept pairs. The primary correctness signal of the stage.

  graph_components:
    direction: lower_better
    meaning: >
      Connected components of the view graph. Anything above 1 means images that
      no track can ever link, and no downstream module can repair it.

  largest_component_fraction:
    direction: higher_better
    meaning: >
      Fraction of images in the biggest component. Says how bad a split is:
      graph_components of 2 is one stray frame or two half-scenes.

  planarity:
    direction: lower_better
    nullable: true
    meaning: >
      Homography inliers over fundamental inliers, averaged over pairs. Near 1
      means the correspondences are explained by a PLANE as well as by a BASELINE,
      and a baseline is what every geometric stage downstream needs. Null when the
      matcher was asked not to measure it.

      THIS IS NOT A MATCHING FAILURE and no matcher parameter fixes it --
      inlier_ratio is often excellent alongside it. It is the signal to change what
      the pipeline does, not how well this stage did it. Two causes hide behind the
      one number:

      PURE ROTATION -- the camera turned without translating. There is no parallax,
      so there is no structure to recover from these views at any quality of
      matching. Drop the offending frames or use views that do have translation; if
      most of the set is like this, the capture cannot be reconstructed and saying
      so is the correct answer.

      PLANAR SCENE -- there is a real baseline, but the two-view essential-matrix
      decomposition is ill-conditioned on coplanar structure. The fix is to avoid
      bootstrapping from two views: a global reconstructor solves the view graph at
      once, and a feed-forward pose estimator never decomposes an essential matrix
      at all. Staying incremental means raising the pose module's
      init_min_angle_deg so the seed comes from whatever non-planar pair exists.

      This metric cannot separate the two -- it is per-pair and averaged. What
      separates them is whether OTHER pairs in the set carry parallax, which is
      scene_analysis/v1's degeneracy group (pure_rotation_risk beside
      planar_dominance). See skills/families/matching.md.
