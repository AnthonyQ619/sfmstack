type: pairwise_matches/v1
summary: Two-view correspondences between image pairs.

description: |
  One half of what the old PointsMatched conflated. That class was simultaneously
  a pairwise container, a multi-view track container, and an observation registry
  reconciling the two; every consumer branched on which half happened to be
  populated. They are separate types here: this one, and tracks/v1.

  `feature_index` is optional because detector-free matchers have no global
  feature table to index into. Its absence is exactly the signal a consumer needs
  to know it is looking at pair-local correspondences.

files:
  pairs:
    required: true
    arrays:
      image_pair:
        required: true
        shape: [null, 2]
        dtype: [int32, int64]
        columns: [image_i, image_j]
        description: |
          The image pairs that were matched. Not assumed consecutive -- a view
          graph from retrieval or exhaustive matching is equally valid here.
      match_count:
        required: false
        shape: [null]
        dtype: [int32, int64]
        description: |
          Surviving matches on each pair, aligned to image_pair. The scalar
          metrics are a mean and a min over this array; this is the array.

          It is here because the decisions at this stage are about WHICH pair, not
          how many matches on average. The same count means opposite things in two
          positions: twenty matches on an edge whose images already share a
          thousand elsewhere is redundant, and twenty matches on the only link
          between two halves of a capture is the reconstruction. No aggregate can
          tell those apart. See skills/plan/matching.md for how to read it.

  matches:
    required: true
    arrays:
      xy:
        required: true
        shape: [null, 4]
        dtype: [float32, float64]
        columns: [x1, y1, x2, y2]
        description: Correspondence coordinates in each image of the pair.
      pair_index:
        required: true
        shape: [null]
        dtype: [int32, int64]
        description: Row in pairs/image_pair this match belongs to.
      feature_index:
        required: false
        shape: [null, 2]
        dtype: [int32, int64]
        columns: [feature_i, feature_j]
        description: |
          Indices into features/v1 keypoints. Present for detector-based
          matchers, absent for LoFTR/RoMa. Track builders use this when present
          and fall back to coordinate merging when not.
      confidence:
        required: false
        shape: [null]
        dtype: [float32, float64]
        description: |
          Per-match confidence, present on EVERY matcher in this repo including
          the classical ones -- which is worth saying because it was documented
          nowhere reachable and readers found it by listing the arrays in the npz.

          The scale is the matcher's own and is not comparable across modules. A
          ratio-test matcher writes 1 - d1/d2, so its values are a transform of
          the test that already ran; a learned matcher writes its assignment
          score. Both are usable the same way -- RANKED WITHIN ONE ARTIFACT,
          never thresholded against a number from another.

          What it is for is the per-pair test that worked on every capture it was
          tried on: average it per pair and ask whether the pairs fall into two
          populations. A group sitting well below the rest, on a handful of pairs,
          is the shape of matches that are wrong rather than merely thin -- and it
          separates them when count and spatial spread do not. See
          skills/plan/matching.md.

invariants:
  - check: same_length
    args: {file: matches, arrays: [xy, pair_index]}
  - check: finite
    args: {file: matches, array: xy}
  - check: values_within
    args: {file: matches, array: pair_index, minimum: 0}

# Required of every matcher. These describe the VIEW GRAPH and its quality, which
# is what makes a brute-force matcher, an approximate one, a learned one and a
# detector-free one comparable at this stage.
metrics:
  pairs_proposed:
    direction: neutral
    meaning: >
      Pairs the pairing policy offered to the matcher, before any survived. The
      denominator for pairs_matched and for weak_pairs, and the module is the only
      thing that knows it: an exhaustive sweep proposes n(n-1)/2, a sequential
      window proposes fewer and the arithmetic is edge-truncated. Published because
      the guidance says to read pairs_matched against it and readers were computing
      it by hand -- correctly under exhaustive pairing, and by an expression nobody
      reliably gets right under any other.

  pairs_matched:
    direction: higher_better
    meaning: >
      Pairs that survived min_matches. Read against pairs_proposed, which is the
      denominator and is published beside this: a sequential window and an
      exhaustive sweep are not the same denominator.

      Survived MIN_MATCHES, which is a parameter, so this is a reading about a
      configuration as much as about a capture, and it is not comparable across
      runs that set that floor differently. See min_image_degree for what that
      costs and for the two ways to check whether a recovered pair is content or
      noise.

  matches_per_pair:
    direction: higher_better
    meaning: >
      Mean surviving matches per kept pair. Rises when the matcher is permissive
      as readily as when it is good, so never read it without inlier_ratio.

  min_matches_per_pair:
    direction: higher_better
    meaning: >
      The weakest kept pair. A pair at the floor is a hinge in the view graph and
      the likeliest place for the reconstruction to break -- IF it is load-bearing.
      Whether it is depends on the degree of the images it joins, not on the count:
      the same weak edge is a hinge on an image that has no other, and a rounding
      error on an image carrying nine more. Read it beside min_image_degree and the
      match_count array. Also not comparable across runs that dropped different
      numbers of pairs -- discarding more thin pairs improves this number by
      survivorship alone.

  min_image_degree:
    direction: higher_better
    meaning: >
      The fewest surviving pairs any one image has. The margin that
      graph_components does not report: a component count of 1 says the graph has
      not split, and says nothing about how close it came.

      BOTH THIS AND pairs_matched ARE RELATIVE TO min_matches, AND COUNT EDGES
      WITHOUT ASKING WHETHER THEY ARE REAL. They are the readings to trust after
      graph_components is demoted, but they are not unconditional. Lowering
      min_matches manufactures both: measured on two captures, dropping it to the
      algebraic floor took a graph from two thirds of its pairs at degree four to
      EVERY pair at degree eleven, with every added edge carrying eight to
      fourteen matches -- a seven-degree-of-freedom fit with no redundancy, which
      is noise fitted, not content found. And a matcher can inflate them with
      wrong-but-verified edges: on a repetitive capture the ratio test returned a
      denser graph than the joint matcher, and the extra edges were the two ends
      of a linear walk matched onto the wrong repeat.

      Two ways to tell manufactured connectivity from the real thing, both cheap:
      re-run once with geometric_model: none and compare the RAW candidate counts
      on kept versus dropped pairs -- a real pair and a noise pair sit either side
      of an empty gap, measured as thirty-seven-and-up against ten-to-thirty on
      one capture -- and read cycle_merge_rate, which counts the wrong-but-
      verified edges directly. inlier_ratio also falls when the graph is padded,
      which is the cheapest hint that it happened.

  inlier_ratio:
    direction: higher_better
    meaning: >
      Fraction of matches consistent with the estimated two-view geometry, over
      kept pairs. The primary correctness signal of the stage.

  graph_components:
    direction: lower_better
    meaning: >
      Connected components of the view graph. Anything above 1 means images that
      no track can ever link, and no downstream module can repair it. A FAILURE
      CONDITION rather than a health check: it reports the split after it has
      happened, and on a small ordered set the consecutive chain almost always
      survives, so a reading of 1 is the ordinary case and not evidence of a robust
      graph. Two configurations differing by half the possible pairs have both
      reported 1. Read min_image_degree for the margin and pairs_matched against
      the pairing's own denominator for the reach.

  largest_component_fraction:
    direction: higher_better
    meaning: >
      Fraction of images in the biggest component. Says how bad a split is:
      graph_components of 2 is one stray frame or two half-scenes.

  cycle_merge_rate:
    direction: lower_better
    nullable: true
    meaning: >
      Fraction of three-view chains where matching i->j->k lands on a DIFFERENT
      keypoint than the direct i->k match, far enough away to be a different piece
      of the scene rather than the same one detected twice.

      The only reading at this stage that can see a wrong-but-verified match. A
      two-view check tests each pair against its own model, so a correspondence
      displaced onto a repeated structure passes it -- and when the camera slides
      along the repeat, that displacement lies along the epipolar line, so no
      ransac_threshold rejects it. Such a match is counted as an inlier by
      inlier_ratio, leaves planarity unmoved, and adds an edge that
      graph_components and min_image_degree both read as connectivity. This is
      what the tracker later reports as inconsistent_rate; it does not need to
      wait for the tracker.

      Null, not zero, when undefined: a detector-free matcher publishes no
      feature_index so there is no identity to agree about, and a view graph with
      no closed triple offers nothing to test -- which is why a sequential run
      reports null here instead of a flattering zero.

      READ THE SUM OF THIS AND cycle_split_rate, NOT THIS ALONE. That correction is
      measured. This metric was annotated as the thing that "arrives later as the
      tracker's inconsistent_rate" and on its own it does not: a capture read 0.0016
      here -- clean by any standard -- and produced a track table 17% self-
      contradictory, while across a parameter sweep it moved 25% and the tracker's
      reading moved nine-fold. The reason is mechanical. The tracker counts a merged
      group observed twice in one image, and BOTH failures produce that: two scene
      points fused, and one point carried on two keypoints matched inconsistently.
      It sees their union.

      Over 54 paired runs the sum tracked inconsistent_rate MONOTONICALLY WITHIN
      EVERY CAPTURE -- five of seven sweeps without a single inversion, the other
      two with one each between near-equal values. Across captures the constant
      relating them ranges about fourfold, so this is a TUNING INSTRUMENT AND NOT A
      THRESHOLD: sweep a matcher parameter and take the direction, do not read an
      absolute number and predict a tracker value from it.

      What each term separately buys you is WHICH REPAIR. A high merge rate means
      the matcher is admitting wrong correspondences -- tighten it. A high split
      rate with a clean merge rate means the detector is emitting duplicates at one
      physical point, which no matcher setting reaches.

      Compare two runs on the same detection artifact; across different detectors
      the keypoint tables differ and the denominators are not the same population.

  cycle_split_rate:
    direction: lower_better
    nullable: true
    meaning: >
      The same test, for chains that disagree by only a pixel or two: one scene
      point detected twice rather than two points confused. It SHORTENS tracks
      where cycle_merge_rate corrupts geometry, so it is the cheaper failure and
      the far more common one -- measured, it is 70-78% of all disagreements.

      Published separately for that reason. When you are ranking two MATCHERS,
      judge on cycle_merge_rate and read this as the cost in track length: summed
      for that purpose it dominates by volume and inverts the comparison -- a
      matcher has been measured at thirty-four times another's total disagreement
      rate while producing ZERO of the geometry-corrupting kind against the other's
      fifty-four.

      When you are FORECASTING THE TRACKER, add the two. The tracker's
      inconsistent_rate sees the union of both failures, and on three captures this
      term carried nearly all of the signal while the merge rate sat near zero. It
      is also the term that survives into tracking on a classical detector, because
      duplicate keypoints at one physical point are what it is measuring.

      Two questions, two readings, and the difference between them is why these are
      not one number.

  planarity:
    direction: lower_better
    nullable: true
    meaning: >
      Homography inliers over fundamental inliers, averaged over pairs. Near 1
      means the correspondences are explained by a PLANE as well as by a BASELINE,
      and a baseline is what every geometric stage downstream needs. Null when the
      matcher was asked not to measure it.

      THIS IS NOT A MATCHING FAILURE and no matcher parameter fixes the underlying
      GEOMETRY -- inlier_ratio is often excellent alongside it. It is the signal to
      change what the pipeline does, not how well this stage did it.

      THE BANDS, stated here once because three files used to give three
      incompatible answers -- one calling 0.5 and below healthy, one giving the
      symptom as above 0.9, one giving none -- and a capture read 0.78 to 0.87 in
      every configuration, above the first and below the second, with no diagnostic
      firing. That middle region is a real and common state, not a gap:

      BELOW ~0.5 -- general 3D structure. Nothing to do.
      ~0.5 to ~0.9 -- a real baseline with a dominant plane in view. Ordinary for a
      compact subject against a backdrop, for a facade with some depth, and for any
      capture where most correspondences land on one surface. Not a reason to
      change the solver. It IS a reason to watch the triangulation angle rather
      than the reprojection error downstream, because a model can reproject
      beautifully while resolving almost no depth.
      ABOVE ~0.9 -- the warning line. Triangulation is ill-conditioned.

      READ THE BAND ONLY AFTER CHECKING THAT THE NUMBER IS NOT SLACK. It moves with
      ransac_threshold on identical inputs and it moves between matchers on
      identical features -- measured 0.72 against 0.88 on one capture. Sweep the
      threshold before believing a value near a boundary: if the reading moves with
      it you are measuring the verification, not the geometry.

      AND IT CAN DISAGREE WITH THE PRE-STAGE PROBE IN THE DIRECTION NOTHING
      ANTICIPATED. scene_analysis reports planar_dominance and pure_rotation_risk
      over CONSECUTIVE pairs only. A capture has read 0.0 on all of them while this
      metric read 0.85 over an exhaustive sweep -- no consecutive pair is planar,
      and most of the correspondences still land on one wall. The probe reading
      zero does not clear an exhaustive graph.

      But it is a property of the surviving MATCH SET as much as of the scene, and
      it does move under matcher parameters -- which the older wording denied. It
      has been measured rising monotonically with the RANSAC threshold on identical
      inputs while pair count, component count and match counts stayed flat: a
      looser threshold admits more of the homography's inliers than the fundamental
      matrix's, so the ratio climbs. It also rises under a CLEANING move, because
      the confident matches are the ones on the dominant plane and pruning the rest
      concentrates them. Two consequences: a reading is only comparable across runs
      at the same ransac_threshold and the same confidence filtering, and a rise
      after a quality change is the expected direction rather than evidence the
      capture became more degenerate. Sweep the threshold before believing a value
      near the warning line -- if the reading moves with it, you are measuring
      slack, and the scene_analysis degeneracy group is the authority instead.

      Two causes hide behind the one number:

      PURE ROTATION -- the camera turned without translating. There is no parallax,
      so there is no structure to recover from these views at any quality of
      matching. Drop the offending frames or use views that do have translation; if
      most of the set is like this, the capture cannot be reconstructed and saying
      so is the correct answer.

      PLANAR SCENE -- there is a real baseline, but the two-view essential-matrix
      decomposition is ill-conditioned on coplanar structure. The fix is to avoid
      bootstrapping from two views: a global reconstructor solves the view graph at
      once, and a feed-forward pose estimator never decomposes an essential matrix
      at all. Staying incremental means raising the pose module's
      init_min_angle_deg so the seed comes from whatever non-planar pair exists.

      This metric cannot separate the two -- it is per-pair and averaged. What
      separates them is whether OTHER pairs in the set carry parallax, which is
      scene_analysis/v1's degeneracy group (pure_rotation_risk beside
      planar_dominance). See skills/plan/matching.md.
