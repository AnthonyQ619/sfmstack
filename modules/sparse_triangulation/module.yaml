name: SparseTriangulation
version: 1.1.0
kind: sparse
summary: >
  Triangulates tracks against known poses into a sparse model, filtering on ray
  angle, cheirality, and reprojection error. CPU-only.

description: |
  The seam between "where are the cameras" and "where is the scene". Any pose
  source feeds it -- the incremental PnP estimator, VGGT, MapAnything -- because
  it consumes `poses/v1` and knows nothing about how those poses were obtained.

  The predecessor had no equivalent. Triangulation lived inside each pose
  estimator and inside each sparse reconstructor, in four separate
  implementations with four sets of thresholds, and the resulting point cloud
  could not be compared across them because the filtering differed. Splitting it
  out means swapping the pose estimator changes exactly one thing.

  Each track is triangulated from the widest-baseline pair of views that observed
  it, then verified in every observing view. A point that reprojects badly in any
  view is discarded rather than kept with a large residual, because a single bad
  observation is enough to drag a bundle adjustment.

image: sfmstack/sparse-triangulation:1.1.0
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 4
  expected_duration_s: 30
  timeout_s: 1800

consumes:
  scene: {type: scene/v1, required: true}
  tracks: {type: tracks/v1, required: true}
  poses: {type: poses/v1, required: true}

produces:
  sparse: {type: sparse_model/v1}

params:
  min_triangulation_angle_deg:
    type: number
    default: 2.0
    minimum: 0.1
    maximum: 30.0
    description: Minimum ray angle for a point to be kept, in degrees.
    tuning: >
      The accuracy/completeness dial. Points below ~1 degree have depth
      uncertainty measured in scene diameters and are worse than absent.

      CHECK WHETHER IT BINDS BEFORE YOU MOVE IT, and the check is free: read
      p05_triangulation_angle on a run at the default. That is the weak end of the
      distribution, so if it already sits above the value you were going to raise
      to, the filter has nothing to reject and the run you were about to spend
      would return a byte-identical artifact. Measured across a seventeen-capture
      sweep, raising this to 3-5 was a NO-OP on most captures -- rejected_angle
      stayed at zero -- and on the captures where it did bite it removed 10-24% of
      the model and made the POST-BA error WORSE, not better.

      Why the earlier advice ("raise to 3-5 before a bundle adjustment you intend
      to trust") failed: this filter is GLOBAL and the defect it targets is a
      TAIL. On a model whose weak structure is a small localised population, it
      charges the whole cloud for one region's problem, and the points it removes
      are disproportionately the far ones -- which on a capture whose subject has
      real depth range means deleting the scene rather than cleaning it.

      So: raise it when p05_triangulation_angle is genuinely low and the weak
      points are spread through the model. Leave it alone when p05 already clears
      your threshold, and reach for max_landmark_distance instead when the weak
      points are a localised escaping tail -- that is 25x cheaper in points on the
      capture where both were measured. Lower it only for a denser cloud you do
      not intend to measure with.

  max_reprojection_error:
    type: number
    default: 4.0
    minimum: 0.5
    maximum: 20.0
    description: Maximum pixel error in ANY observing view, at working resolution.
    tuning: >
      Applied as a maximum over views, not a mean, so one bad observation kills
      the point. That is deliberate. If point_count is too low and
      mean_reprojection_error is already good, this is the filter that is binding.

  min_observations:
    type: integer
    default: 2
    minimum: 2
    maximum: 50
    description: Minimum registered views a track must appear in.
    tuning: >
      2 is the geometric minimum and admits points supported by a single pair. 3
      is the honest floor for anything you intend to bundle-adjust -- a two-view
      point contributes no redundancy of its own, so it gains least from a bundle
      adjustment -- but it does gain, measured at 2-13% on two captures, because the
      cameras move and it moves with them. It is not free to discard: raising this
      has been measured deleting half a cloud.

      NAME MISMATCH, worth knowing before you transfer a parameter set:
      SparseTriangulationGTSAM calls this same filter `min_track_len`. The family
      file describes the two modules as taking the same filters, and on this one
      the NAMES differ. They also publish different healthy floors for
      `mean_track_length` -- 3.0 here, 2.5 there -- so one cloud can read out of
      band on this module and comfortably in band on the other. Neither floor is
      wrong; they were set against different expectations, and a reader comparing
      the modules should compare the numbers, not the verdicts.

  colour_points:
    type: boolean
    default: true
    description: Sample RGB from the images at each point's observations.
    tuning: >
      Costs one decode per image. Turn off for speed when the cloud is only an
      intermediate; the colours are what make a sanity check by eye possible.

metrics:
  min_frame_points:
    meaning: >
      The fewest observations any REGISTERED camera contributes to this model.
      registered_images says a camera has a pose; this says whether it has any
      structure. They are not the same reading, and the gap between them has been
      measured: a model reported 12/12 registered while one of those cameras was
      held by TWO shared observations, with every other metric healthy. Read this
      one before believing a registration count.
    direction: higher_better
    healthy: [50, null]
  two_view_fraction:
    meaning: >
      The share of points seen in exactly two views. Two-view points are exactly
      determined, so their reprojection residual is near zero BY CONSTRUCTION --
      measured at roughly a third of the residual of five-view points on the same
      model. On a cloud that is half two-view, therefore, half of
      mean_reprojection_error is made of numbers that cannot carry error, and the
      headline reads better than the model is. mean_track_length is a mean over a
      bimodal distribution and hides this completely.
    direction: lower_better
    healthy: [null, 0.6]
  p95_reprojection_error:
    meaning: >
      The tail of the per-point error distribution. The published mean runs about
      1.5x the median on a typical model here, because a small tail owns it -- so
      every judgement made on the mean alone is a judgement about the outliers a
      robust loss exists to discount. Read this beside the mean: a mean close to
      the p95 is a uniformly mediocre model, a mean far below it is a good model
      with a few bad points.
    direction: lower_better
    healthy: [null, 2.0]
  p05_triangulation_angle:
    meaning: >
      The weak end of the parallax distribution, where median_triangulation_angle
      is the middle of it. The escape failure this module describes -- a point on
      near-parallel rays fleeing to a huge distance while reprojecting perfectly
      into the views that made it -- is a TAIL phenomenon, and a median cannot see
      it. A model with 9% of its points inside 2-4 degrees has been measured
      reading a perfectly healthy median with no diagnostic firing.
    direction: higher_better
    healthy: [1.0, null]
  point_count:
    direction: higher_better
    healthy: [100, null]
    meaning: Surviving 3D points. Below ~100 there is nothing to bundle-adjust.

  observation_count:
    direction: higher_better
    healthy: [300, null]
    meaning: Total 2D observations of surviving points; the size of the BA problem.

  mean_reprojection_error:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: Mean pixel error over kept observations, at working resolution.

  mean_track_length:
    direction: higher_better
    healthy: [3.0, null]
    meaning: >
      Observations per surviving point. 2.0 means the cloud is entirely two-view
      and bundle adjustment has no redundancy to exploit.

  median_triangulation_angle:
    direction: higher_better
    healthy: [3.0, null]
    meaning: Median widest ray angle over kept points, in degrees.

  yield:
    direction: higher_better
    healthy: [0.3, null]
    meaning: >
      Kept points over input tracks. Low yield with good error means the filters
      are doing their job; low yield with bad error means the poses are wrong.

  rejected_cheirality:
    direction: lower_better
    healthy: [null, 0.05]
    meaning: >
      Fraction of tracks rejected for landing behind a camera. A raised value is
      the signature of a wrong pose, not of a bad threshold -- no filter setting
      fixes it.

  registered_images:
    direction: higher_better
    healthy: [3, null]
    meaning: >
      Cameras carrying a valid pose in this model. Required by sparse_model/v1:
      point_count and reprojection error are not comparable between models with
      different camera counts, and this is what says whether they are.

diagnostics:
  - code: no_points
    severity: error
    message: No track survived triangulation.
    suggested_actions:
      - Check the pose artifact's registered_fraction and mean_reprojection_error.
      - Lower min_triangulation_angle_deg if the capture genuinely has little baseline.
    see_also: limitations.md#when-triangulation-produces-nothing

  - code: bad_poses_suspected
    severity: warn
    message: Many tracks landed behind a camera, which points at the poses.
    suggested_actions:
      - Re-check the pose estimator's metrics before tuning anything here.
      - A high rejected_cheirality with low reprojection error means a sign or frame convention error.
    see_also: limitations.md#cheirality-failures-are-a-pose-problem

  - code: two_view_cloud
    severity: warn
    message: Points are supported by two views each; BA has no redundancy.
    suggested_actions:
      - "Widen the matcher's pairing so tracks reach further -- `window` under
        sequential; under exhaustive lower min_matches instead."
      - Raise min_observations to 3 to see how much genuine multi-view structure exists.
    see_also: tuning.md#mean_track_length-near-20

  - code: weak_geometry
    severity: warn
    message: Points are triangulated from near-parallel rays.
    suggested_actions:
      - Raise min_triangulation_angle_deg.
      - No parameter recovers missing parallax; the capture is what it is.
    see_also: limitations.md#when-triangulation-produces-nothing
