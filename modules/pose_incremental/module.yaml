name: PoseEssentialToPnP
version: 1.2.1
kind: pose
summary: >
  Incremental SfM: essential-matrix bootstrap on a chosen initial pair, then
  repeated PnP registration against triangulated structure. CPU-only.

description: |
  The classical incremental pipeline, in the order COLMAP established. Pick an
  initial pair with real parallax, recover its relative pose from the essential
  matrix, triangulate what the pair sees, then repeatedly register whichever
  unregistered image has the most 2D-3D correspondences and triangulate whatever
  that makes newly visible.

  It consumes `tracks/v1` rather than `pairwise_matches/v1`, which is the main
  departure from the predecessor. That module walked pairs in sequence and
  maintained its own track structure by chaining consecutive matches, which meant
  registration order was fixed by file order and a single unregisterable frame
  truncated everything after it. Here the tracks already exist as a multi-view
  table, so registration is driven by evidence: the best-connected image goes
  next, and a frame that cannot be registered is skipped without ending the run.

  Registration is interleaved with LOCAL bundle adjustment over a sliding window of
  the most recently registered cameras. This is not an optimisation -- it is what
  stops error compounding. Each new pose is estimated against structure that earlier
  poses triangulated, so without in-loop refinement a small error early becomes the
  frame that everything later is measured in. It matters most with learned detectors
  and trackers, whose correspondences are dense and confident enough that PnP
  reports healthy inlier counts on a pose that is already drifting.

  The window is taken in REGISTRATION order, not frame order. The predecessor took
  frames [id-N, id] because it registered strictly in file order; here the next
  image is whichever has the most 2D-3D correspondences, so a frame-indexed window
  would hold recently-moved cameras fixed and free ones that nothing had touched.

  `BundleAdjustmentLocal` still exists as a separate module and is not made
  redundant by this: that one refines an EXISTING sparse_model/v1 at a window you
  choose, which is a repair tool. This is the in-loop drift control that has to
  happen while the model is being built, because by the time the model exists the
  drift is already baked into the structure.

  Scale is arbitrary and unrecoverable from images alone. The initial pair's
  baseline is fixed to unit length, so every distance downstream is in that unit.

image: sfmstack/pose-incremental:1.2.1
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 4
  # Hint for ~40 images with a few thousand tracks. Cost is dominated by the
  # per-image PnP and the triangulation sweep, both roughly linear in track count.
  expected_duration_s: 60
  timeout_s: 3600

consumes:
  scene: {type: scene/v1, required: true}
  tracks: {type: tracks/v1, required: true}

produces:
  poses: {type: poses/v1}

params:
  min_triangulation_angle_deg:
    type: number
    default: 2.0
    minimum: 0.1
    maximum: 30.0
    description: Minimum ray angle for a point to be accepted, in degrees.
    tuning: >
      The single most important parameter for accuracy. A point triangulated from
      near-parallel rays has enormous depth uncertainty and drags every pose that
      later registers against it. Raise toward 3-5 on wide-baseline captures where
      you can afford to lose points; lower toward 1.0 only when
      `points_triangulated` is so low that registration stalls, and expect
      `mean_reprojection_error` to rise when you do.

  init_min_angle_deg:
    type: number
    default: 4.0
    minimum: 0.5
    maximum: 45.0
    description: Minimum median parallax for a pair to be eligible as the seed.
    tuning: >
      A seed pair with too little parallax poisons the whole reconstruction --
      every subsequent pose is registered against structure triangulated from it.
      Stricter than min_triangulation_angle_deg on purpose. If no pair qualifies
      the module fails rather than seeding badly, which is the correct outcome:
      lower it only after checking the capture actually has baseline.

  max_reprojection_error:
    type: number
    default: 4.0
    minimum: 0.5
    maximum: 20.0
    description: Points above this pixel error are discarded after each round.
    tuning: >
      In WORKING-resolution pixels, so scale it with the scene's resize. Tightening
      it below ~2 on a heavily downscaled scene removes real structure; loosening
      past ~8 admits mistriangulated points that then corrupt PnP.

  pnp_reprojection_error:
    type: number
    default: 3.0
    minimum: 0.5
    maximum: 20.0
    description: RANSAC inlier threshold for PnP registration, in pixels.
    tuning: >
      Keep at or slightly below max_reprojection_error. Raising it registers more
      images at the cost of registering some of them wrongly, which is worse than
      leaving them out -- an image registered at the wrong pose contributes wrong
      observations to every point it sees.

  min_pnp_inliers:
    type: integer
    default: 20
    minimum: 6
    maximum: 500
    description: Minimum PnP inliers for an image to count as registered.
    tuning: >
      Below 6 the problem is not determined at all. 20 is a permissive floor;
      raise it toward 50 if `mean_reprojection_error` is poor and
      `registered_fraction` is high, which is the signature of marginal images
      being admitted.

  min_track_len:
    type: integer
    default: 2
    minimum: 2
    maximum: 50
    description: Ignore tracks shorter than this.
    tuning: >
      2 uses everything. 3 restricts structure to tracks with genuine multi-view
      support, which usually lowers reprojection error and point count together --
      worth trying when the tracker reports a raised inconsistent_rate.

  max_iterations:
    type: integer
    default: 10000
    minimum: 100
    maximum: 100000
    description: RANSAC iterations for PnP and for the essential matrix.

  confidence:
    type: number
    default: 0.9999
    minimum: 0.9
    maximum: 0.999999
    description: RANSAC confidence.

  local_ba:
    type: boolean
    default: true
    description: Refine a window of recent cameras and their structure during registration.
    tuning: >
      Leave on, and expect it to buy less the shorter and better-connected the
      set is. It removes drift that accumulates along a registration chain; on a
      small exhaustively-matched set every frame shares structure with every
      other, there is barely a chain, and it has been measured making the raw
      mean reprojection error WORSE on such a capture while the median improved.
      That is not a reason to turn it off -- the median is the statistic that
      survives a few bad observations -- but it does mean the measured benefit
      tables below are not predictions for a set of that shape.

      Off is only correct when you are deliberately measuring how much
      drift the registration itself produces, or when pycolmap is unavailable --
      the module raises rather than silently skipping in that case. Turning it off
      does not save as much as it looks like it does: the cost is roughly linear
      in the number of registrations and each solve is small by construction.

  local_ba_window:
    type: integer
    default: 8
    minimum: 3
    maximum: 100
    description: Cameras in the sliding window. The two oldest are held fixed.
    tuning: >
      READ THE IMAGE COUNT FIRST. Everything below is written for a sequence
      LONGER than the window, where "local" and "global" are different solves. On
      a set at or below the window size there is no such distinction: the window
      is the whole model, every camera is in it, and the drift this parameter
      exists to bound cannot accumulate because there is no chain to accumulate
      along. On such a set WIDEN IT TO THE IMAGE COUNT. Narrowing it there is
      harmful, and narrowing is what the rest of this note and the
      not-converging diagnostic would otherwise tell you to do.

      WIDENING DOES TWO THINGS AT ONCE and you have to read both, because on
      some captures they push the headline metric in opposite directions. It
      solves better, and it also RETAINS MORE STRUCTURE -- a point the narrow
      window could not constrain becomes constrained once every camera that sees
      it is inside the window. So read track_utilization BEFORE widening. Where
      it already sits near its ceiling there is little structure left to
      recover, the model barely changes size, and reprojection error falls
      cleanly. Where it sits well below its ceiling the point count rises
      materially, and then error and point count move TOGETHER and neither ranks
      the two runs on its own -- a bigger model is a harder model, and error
      rising while a quarter more structure survives is not a regression. An
      earlier version of this note said the error falls monotonically to the
      image count; that was fitted on captures whose utilization happened to be
      high, and it is wrong as a law.

      WIDENING ALSO REMOVES A CAUSE OF DIVERGENCE rather than merely improving
      an average. An under-constrained point inside a narrow window is what makes
      the local BA gain blow up; admitting the cameras that see it is the fix. A
      run that diverges at the default is worth widening before it is worth
      anything else.

      ON A SEQUENCE LONGER THAN THE WINDOW, a cost/benefit dial -- but the cost
      half of that sentence was doing damage and has been corrected. Cost does
      grow faster than linearly and below 5 there is almost no freedom left after
      the two fixed cameras. What was WRONG was the implication that a wide window
      is an extravagance: "above ~20 you are paying global-BA prices ... widen
      only when local_ba_gain_px stays high".

      Measured across a seventeen-capture sweep, setting this to the FULL IMAGE
      COUNT was the single largest improvement on three captures -- one gained
      about 40% in track_utilization, another 42% lower mean reprojection error
      with more structure at equal registration -- and it cleared a
      local_ba_diverged error that no point-exclusion setting could. On one of
      those captures local_ba_gain_px was FALLING while every other metric
      improved, so the trigger this field used to name moves opposite to the
      benefit and must not be gated on.

      BUT DO NOT READ THAT AS "SET IT TO THE IMAGE COUNT". This is LOCAL bundle
      adjustment: a sliding window over recently registered cameras, re-solved
      every window-size registrations. A window equal to the capture is not a
      wide local BA, it is a global BA run once per window with the drift-control
      property that motivates in-loop refinement thrown away -- and if that is
      what the capture needs, the honest move is BundleAdjustmentGlobal at the
      end, which is cheaper and says what it is.

      What the evidence actually supports is that the OLD CEILING WAS TOO LOW,
      not that there is no ceiling. Stay in window territory -- powers of two from
      8 upward are a reasonable sweep -- and widen while the model improves. Where
      widening only stops helping at the full image count, treat that as a signal
      about the capture (its drift is not local) rather than as the setting to
      ship: reach for the global adjuster instead.

      The artifact publishes only the MEAN gain over all solves, so "late in the
      sequence" was never readable here anyway, and local_ba_gain_px must not be
      used as the widening trigger in either direction.

  local_ba_interval:
    type: integer
    default: 1
    minimum: 1
    maximum: 50
    description: Run a solve every N registrations, once past local_ba_warmup.
    tuning: >
      1 solves after every registration and is the right default for sets of a few
      dozen images. Raise it to 3-5 on long sequences where the per-registration
      solve dominates runtime; the drift it lets through is proportional, so watch
      mean_reprojection_error when you do.

  local_ba_warmup:
    type: integer
    default: 10
    minimum: 0
    maximum: 100
    description: Solve after every registration until this many cameras are registered.
    tuning: >
      Early poses are the ones worth refining unconditionally -- a bad pose among
      the first ten becomes the frame every later image is registered into, and no
      later solve that holds it fixed can undo it. Lowering this below ~5 saves
      almost nothing and gives up the cheapest accuracy in the module.

  local_ba_max_iterations:
    type: integer
    default: 25
    minimum: 1
    maximum: 500
    description: Ceres iteration cap per local solve.
    tuning: >
      Deliberately low: this runs tens of times, and a window that needs many
      iterations is usually a window that is too wide. Check local_ba_runs against
      the local_ba_not_converging diagnostic before raising it.

  local_ba_robust_loss:
    type: boolean
    default: true
    description: Cauchy loss instead of squared error in the local solves.
    tuning: >
      On is right while the model is being built, because that is exactly when
      mistriangulated points are still in the structure and a squared loss lets one
      of them move a camera. Note the interaction with local_ba_gain_px: a robust
      solve can lower the robust cost while raising the raw mean, which is the
      metric turning negative for a good reason.

  local_ba_loss_scale:
    type: number
    default: 1.0
    minimum: 0.01
    maximum: 100.0
    description: Cauchy loss scale, in working-resolution pixels.
    tuning: >
      Residuals beyond roughly this are downweighted. Keep it well below
      max_reprojection_error -- a scale as loose as the filter means the robust
      loss never engages before the filter would have removed the point anyway.

metrics:
  registered_fraction:
    direction: higher_better
    healthy: [0.9, null]
    meaning: >
      Fraction of scene images given a pose. Below 1.0 some images could not be
      registered; the artifact's `valid` array says which, and every consumer must
      honour it.

  registered_images:
    direction: higher_better
    healthy: [3, null]
    meaning: Absolute count. Two is the seed pair alone, i.e. total failure to grow.

  points_triangulated:
    direction: higher_better
    healthy: [100, null]
    meaning: >
      Surviving 3D points after angle and reprojection filtering. This is
      structure, not poses, but a reconstruction with few points has poses that
      nothing constrains.

  mean_reprojection_error:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: >
      Mean pixel error over all surviving observations, at working resolution.
      The primary accuracy signal. Above ~3 the poses are not usable for anything
      metric.

  median_triangulation_angle:
    direction: higher_better
    healthy: [3.0, null]
    meaning: >
      Median ray angle over surviving points, in degrees. Low means the structure
      is poorly conditioned in depth even where reprojection error looks fine --
      the two can disagree, and this one is the more honest.

  track_utilization:
    direction: higher_better
    healthy: [0.3, null]
    meaning: >
      Fraction of input tracks that became a surviving 3D point. Low with healthy
      reprojection error means the filters are strict; low with poor error means
      the tracks were wrong.

      NOT COMPARABLE ACROSS min_track_len SETTINGS. The denominator is the FULL
      input track table and does not shrink when min_track_len filters tracks out
      before triangulation, so raising that parameter makes this metric fall
      mechanically -- it is not evidence that the setting hurt. Nor is it
      comparable across captures: a cropped subject, a dead backdrop, or a capture
      that is two disconnected sites all bound it for reasons that have nothing to
      do with this module. Compare it only between runs that differ in something
      other than which tracks were admitted.

  min_frame_long_tracks:
    direction: higher_better
    healthy: [20.0, null]
    meaning: >
      In the weakest frame, how many of its tracks reach three or more views.
      THIS IS THE REGISTRABILITY FLOOR, and min_frame_observations is not.

      Resection needs 2D-3D correspondences: points some other pair already
      triangulated, seen again in the image being registered. Only a track
      reaching a third view can supply one. So a frame can carry many
      observations and still fail PnP, because almost all of them belong to
      two-view tracks -- measured on a capture that failed exactly that way with
      138 observations against a floor of 50 and 9 long tracks, while the metric
      its own remedy section named read three times healthy.

      WHAT IT DOES NOT CATCH, and this cost a reader four runs to establish. It is
      a MINIMUM OVER FRAMES, so it answers "can every frame be registered" and
      nothing else. It is silent on whether a frame's tracks are CORRECT. Measured:
      on a capture whose two blank-wall frames carried tracks that could not be
      triangulated at any threshold, this metric named a THIRD frame -- one that
      went on to survive triangulation at 96% -- while the two that collapsed
      carried three times its value and survived at 6% and 17%. A minimum is the
      wrong statistic when the failure is quality rather than quantity, and it
      registered all twelve frames exactly as it promised. For the quality
      question, read min_frame_points on the sparse model, one stage down; there is
      no reading for it here.

      THE BAND IS min_pnp_inliers, stated here at that parameter's default of 20.
      Below it, the weakest frame cannot in principle reach the inlier count
      registration demands, and it will drop. If you have changed
      min_pnp_inliers, compare against your value rather than this band.

      This metric exists only on the geometric estimator, because only the
      geometric estimator resects. A feed-forward module poses every image in one
      pass and has no such floor -- the quantity is meaningless there rather than
      merely absent.

      WHICH frame is short is in the tracks artifact, as
      observations.long_tracks_per_frame. This is its minimum.

  init_pair_angle:
    direction: higher_better
    healthy: [4.0, null]
    meaning: >
      Median parallax of the seed pair, in degrees. Everything else is registered
      against structure this pair created, so a weak seed is not recoverable later.

  local_ba_runs:
    direction: neutral
    meaning: >
      Local bundle adjustments performed during registration. 0 with local_ba on
      means no window ever carried enough structure to solve, which is a structure
      problem, not a BA setting.

  local_ba_gain_px:
    direction: higher_better
    healthy: [0.0, null]
    meaning: >
      Mean reduction in window reprojection error per local solve, in pixels; null
      when local_ba is off. This is how much drift the in-loop refinement is
      actually removing. Near zero late in a run is the healthy end state -- the
      window is already consistent. Sustained large values mean the registrations
      are producing poses that need substantial correction, so read it beside
      mean_reprojection_error rather than alone. Can go slightly negative with
      local_ba_robust_loss on, because Ceres is minimising the robust cost and this
      metric reports the raw mean.

      WHAT IT CANNOT DO, all measured. It is NOT comparable across
      local_ba_window settings -- a narrower window leaves each solve further from
      its own optimum, so the per-solve gain RISES while the finished model gets
      worse. It does NOT rank local_ba_loss_scale: swept downward it rises
      monotonically straight through the point where median_reprojection_error
      turns and starts climbing. And it is NOT the size of what local BA is worth:
      an ablation on a capture reading a gain of 0.02 px found switching local BA
      off cost 14% of the mean error. Use it to see that in-loop refinement is
      doing something; use median_reprojection_error to choose between settings.

      Suppressed to null when a solve diverges, which raises local_ba_diverged.

  median_reprojection_error:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: >
      Median pixel error beside the mean. Mean well above median means a few bad
      observations; the two together means a systematic problem. Null when
      local_ba never ran and no observations were measured.

diagnostics:
  - code: uncalibrated_scene
    severity: error
    message: This module needs intrinsics and the scene carries none.
    suggested_actions:
      - Pass calibration_path to SceneLoader.
      - Or use a pose estimator that estimates intrinsics itself; see limitations.md.
    see_also: limitations.md#uncalibrated-scenes

  - code: no_viable_initial_pair
    severity: error
    message: No image pair had enough parallax to seed the reconstruction.
    suggested_actions:
      - Check the matcher's `planarity` -- a planar or rotation-only capture cannot seed.
      - Lower init_min_angle_deg only after confirming the capture has baseline.
      - "Widen the matcher's PAIRING so more pairs are candidates -- `window` only
        does this under `pairing: sequential`; under `exhaustive` every pair is
        already proposed and the knob is inert. There, the dial is the matcher's
        acceptance threshold or its min_matches floor."
    see_also: limitations.md#degenerate-captures

  - code: partial_registration
    severity: warn
    message: Some images could not be registered and carry valid=False.
    suggested_actions:
      - "Read min_frame_long_tracks on THIS artifact, NOT the tracker's min_frame_observations: PnP needs points a third view already triangulated, so a frame can sit far above the observation floor and still be unregisterable."
      - "WHICH frame is short: the tracks artifact carries observations.long_tracks_per_frame only if its tracker emitted it, which older track artifacts do not. If the file is absent the count is still derivable from the observations array by hand, and this module computed its own metric that way. Do not treat the array as guaranteed."
      - "Link those frames to more neighbours at the matcher -- under `pairing:
        sequential` that is `window`; under `exhaustive` the pairs already exist
        and were dropped, so the dial is min_matches or the acceptance threshold."
      - Lower min_pnp_inliers only if you accept weaker poses.
      - "STOP TURNING DIALS IF graph_components IS 1. Every action above tunes
        seed-and-grow, and the failure may be seed-and-grow itself: this module
        places one image at a time against structure built so far, so a chain
        that cannot get started reports two registered frames and a clean error
        over them while the correspondences were sufficient all along. A
        reconstructor that estimates poses globally has no registration order to
        stall, consumes the SAME matches, and needs no poses. Measured on five
        captures this module left between 0.31 and 0.97 registered: it reached
        1.00 on every one, and was more accurate against ground truth on every
        one. Find it with sfm_find_alternatives(produces='sparse_model/v1',
        consumes='pairwise_matches/v1'); the choice is argued in
        skills/plan/pose.md. Note it produces a sparse model directly, so the
        health profile's yield rungs cannot be computed on the result --
        skills/health/ladder.md says how to compare one against a model from
        this chain."
    see_also: tuning.md#registered_fraction-below-10

  - code: high_reprojection_error
    severity: warn
    message: Surviving observations have high reprojection error.
    suggested_actions:
      - Raise min_triangulation_angle_deg to reject ill-conditioned points.
      - Tighten max_reprojection_error.
      - Run bundle adjustment; this module does not refine globally.
    see_also: tuning.md#mean_reprojection_error-above-2

  - code: local_ba_diverged
    severity: error
    message: A local bundle-adjustment solve diverged; the poses are not trustworthy.
    suggested_actions:
      - "FIRST widen local_ba_window -- sweep upward through window sizes, do NOT jump to the image count. Across a seventeen-capture sweep widening cleared the divergence where point exclusion did not, and improved every other metric at once. If only a full-capture window helps, the drift is not local: use BundleAdjustmentGlobal instead."
      - "Then exclude under-constrained points: raise min_triangulation_angle_deg, or min_track_len to 3. These worked on the two captures the original account was fitted on and have since failed on several others, so they are no longer the first move."
      - "Do NOT read local_ba_gain_px on this run; it is suppressed."
      - "If it persists, set local_ba: false. On more than one capture that produced the BEST model on every axis, not merely a usable one, so it is a legitimate configuration rather than a defeat."
    see_also: tuning.md#local-ba-diverged

  - code: local_ba_not_converging
    severity: warn
    message: >
      Local solves are hitting the iteration cap. Raised at INFO when the window is
      already consistent, which is the ordinary case and costs nothing.
    suggested_actions:
      - "Check local_ba_loss_scale FIRST: a scale far above the residuals leaves the robust loss disengaged, and it is the only one of these knobs measured to improve anything."
      - Raise local_ba_max_iterations only if the gain is large relative to the residual; where it is not, this was measured to buy nothing at eight times the cost.
      - On a set at or below local_ba_window, WIDEN the window to the image count rather than narrowing it -- narrowing was measured strictly harmful there.
    see_also: tuning.md#local-ba-is-not-converging

  - code: local_ba_not_helping
    severity: info
    message: Local BA is not lowering window reprojection error.
    suggested_actions:
      - Nothing, if mean_reprojection_error is already low; there is no drift to remove.
      - With local_ba_robust_loss on, the robust cost can fall while the raw mean rises.
      - Set local_ba false if the runtime is not worth it for this stack.
      - This metric is NOT comparable across local_ba_window settings, and it does not rank local_ba_loss_scale settings -- it rose monotonically through the point where the model started getting worse. Judge those two on median_reprojection_error instead.
    see_also: tuning.md#local_ba_gain_px-at-or-below-zero

  - code: weak_structure
    severity: warn
    message: Points are triangulated from near-parallel rays.
    suggested_actions:
      - Raise min_triangulation_angle_deg.
      - Widen the capture baseline; no parameter recovers missing parallax.
    see_also: limitations.md#degenerate-captures
