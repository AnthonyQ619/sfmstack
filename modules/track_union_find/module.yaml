name: FeatureTrackUnionFind
version: 1.4.0
kind: tracking
summary: >
  Chains pairwise correspondences into multi-view tracks by union-find, detecting
  and handling tracks that contradict themselves. Pure numpy, no GPU, no weights.

description: |
  Two-view matches say nothing about the third view. This merges them: two
  correspondences that share an endpoint belong to the same scene point, so a
  disjoint-set pass over all matches recovers multi-view tracks from a view graph
  of pairs.

  Detector-based input carries `feature_index`, and merging is exact -- two
  matches share a node when they cite the same keypoint. Detector-free input
  (LoFTR, RoMa) has no keypoint table to cite, so endpoints are merged by
  proximity within each frame instead, controlled by `merge_eps_px`. Both routes
  produce the same tracks/v1, which is what lets the driving agent swap matchers
  without touching anything downstream.

  The interesting part is what happens when a merged group contains two DIFFERENT
  keypoints in the same image. That track is self-contradictory: the same scene
  point cannot project to two places in one view, so at least one of the matches
  that built it is wrong. The predecessor resolved this by letting the last write
  win, silently, which puts a wrong observation into bundle adjustment and
  reports nothing. Here it is counted (`inconsistent_rate`) and handled by an
  explicit policy (`on_conflict`).

  That metric mostly reads UPSTREAM. A high conflict rate is rarely fixable in
  this module -- it means the matcher is producing contradictory correspondences,
  and the useful response is to tighten the matcher or replace it.

image: sfmstack/track-union-find:1.4.0
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 8
  # Hint for ~40 images, sequential pairing, a few hundred thousand matches. Cost
  # is roughly linear in total match count, so `exhaustive` upstream dominates it.
  expected_duration_s: 20
  timeout_s: 1800

consumes:
  scene: {type: scene/v1, required: true}
  matches: {type: pairwise_matches/v1, required: true}

produces:
  tracks: {type: tracks/v1}

params:
  min_track_len:
    type: integer
    default: 2
    minimum: 2
    maximum: 50
    description: Minimum observations for a track to be kept.
    tuning: >
      Raising this improves avg_track_length by deleting short tracks while
      making the underlying problem worse, so never read the mean without
      track_count beside it. 2 keeps every two-view correspondence, which
      triangulation can use but which contributes no multi-view constraint; 3 is
      the honest floor if you want tracks that actually rigidify the solution.
      Prefer raising the matcher's `window` -- that creates long tracks rather
      than filtering for them.

  on_conflict:
    type: string
    default: drop
    enum: [drop, first]
    description: What to do with a track observed twice in the same image.
    tuning: >
      `drop` discards the whole track and is correct when you care about the
      solution: a contradictory track means one of its matches is wrong, and you
      cannot tell which. `first` keeps the earliest observation per frame and
      salvages the rest of the track -- use it only when track_count is so low
      that reconstruction cannot start, and treat it as evidence the matcher
      needs attention rather than as a fix.

  probe_merge_headroom:
    type: boolean
    default: true
    description: >
      Detector-free input only. Rebuild the tracks at twice merge_eps_px to measure
      whether the tolerance is too tight.
    tuning: >
      Leave on. IT COSTS NOTHING ON DETECTOR-BASED INPUT, where it does not run at
      all -- merge_eps_px is inert there, so there is no tolerance to probe and the
      metric comes back null. On detector-free input it rebuilds the tracks at each
      rung of a 2x/4x/8x ladder, so budget roughly four times this module's own
      runtime, which is still small next to any matcher. An earlier version of this
      text said it doubles the runtime; that described a single 2x probe, which the
      adapter no longer does.

      It is the ONLY signal for under-merging -- inconsistent_rate detects the
      opposite error and nothing else here sees this one. Turn it off only when the
      tolerance is already known-good and runtime matters.

  merge_eps_px:
    type: number
    default: 1.5
    minimum: 0.0
    maximum: 20.0
    description: >
      Detector-free input only. Grid size for merging endpoints in the same
      frame; points within half of it always merge, points up to ~1.4x it apart
      may. See artifact.md#how-nodes-are-formed.
    tuning: >
      Ignored entirely when the matches carry feature_index. Measured on real LoFTR
      output at 640px: 1.5px leaves tracks unable to chain (long_track_fraction
      0.078) and two of five images unregisterable; 3px fixes registration; 6px
      chains further at 30x the conflict rate; 12px breaks reconstruction entirely.
      Start at 3-4px for ~640px and scale with the resize -- BUT SCALE IT WITH THE
      RESOLUTION THE MATCHES ARE EXPRESSED IN, WHICH IS THE SCENE'S, NOT THE
      MATCHER'S. That distinction was implicit and it inverts the answer. A
      detector-free matcher may resize internally (LoFTR's resize_long_edge) while
      still writing coordinates in scene pixels, so the sweep above -- run where the
      two happened to coincide -- reads as 3-4px only when they do. On a capture
      whose scene was 1024px and whose matcher ran at 640, the measured optimum was
      0.25px: twenty times below this text, with 3px giving the same track length
      at nineteen times the conflict rate. The governing quantity is the matcher's
      output GRID, not any resolution named here: a coarse-grid matcher quantises
      one endpoint onto a lattice, and the tolerance only has to separate lattice
      cells. Read the diagnostic on the matches artifact, which states a figure for
      that matcher, over this paragraph -- and note the two currently disagree by
      4-6x, which is a known defect, not a subtlety. Too small fragments one
      scene point into short tracks; too large fuses neighbours and shows up as a
      rising inconsistent_rate. See tuning.md -- a synthetic experiment on stripped
      SIFT matches endorses 1-2px and is misleading for real detector-free input.

metrics:
  track_count:
    direction: higher_better
    healthy: [200, null]
    meaning: >
      Tracks surviving min_track_len and the conflict policy. Incremental SfM
      needs hundreds to seed reliably; below ~50 it will not start.

  avg_track_length:
    direction: higher_better
    healthy: [3.0, null]
    meaning: >
      Mean observations per track. 2.0 means nothing merged across more than one
      pair, so the view graph, not the matcher, is what is limiting you.

  long_track_fraction:
    direction: higher_better
    healthy: [0.3, null]
    meaning: >
      Fraction of tracks seen in 3+ views. These are the only tracks that
      constrain relative pose beyond a single pair, so this matters more than the
      mean -- a set can have a healthy mean and still be mostly two-view.

  trifocal_transfer_px:
    direction: lower_better
    nullable: true
    healthy: [null, 3.0]
    meaning: >
      Median held-out three-view transfer error, in pixels. The only metric here
      that measures POSITIONAL accuracy rather than length, coverage or
      self-consistency, and therefore the only one that separates a tracker whose
      tracks are long from one whose tracks are right. Null on an uncalibrated
      scene. See sfmkit.trifocal_transfer for the construction.

      One measurement is one observation of one track in one image: the distance,
      in that image's pixels at the scene's working resolution, between where this
      module put the point and where geometry fitted from OTHER tracks says it
      belongs. The metric is the median over those distances, so it moves with the
      working resolution and reads 0 for a tracker whose positions are exact.

      Comparable across trackers on ONE scene -- which is what it is for -- and not
      across scenes or image counts, because the absolute value depends on the
      baselines of the sampled triples.

  trifocal_samples:
    direction: higher_better
    meaning: >
      Held-out observations the transfer error was measured over. Small means few
      frame triples shared enough tracks, which makes the median above soft.
  trifocal_triples:
    direction: higher_better
    nullable: true
    meaning: >
      Frame triples the transfer measurement actually used, of the twelve it
      attempts. The evidence behind trifocal_transfer_px; read it beside the median.

  trifocal_seconds:
    direction: lower_better
    meaning: >
      Wall clock spent on the transfer measurement, reported because it is the one
      part of this module whose cost is not obvious from its parameters.

  split_rate:
    direction: lower_better
    healthy: [null, 0.2]
    meaning: >
      Fraction of tracks that coincide with another track -- one physical point
      spread across several tracks. The dual of inconsistent_rate, which sees only
      over-merging.

      ON DETECTOR-BASED INPUT THIS READS THE DETECTOR, NOT THIS MODULE AND NOT THE
      MATCHER. A classical detector assigns several keypoints to one physical point
      at different orientations and adjacent scales; chaining merges by
      feature_index, so those never join and each becomes its own track. Measured
      directly on three captures spanning two detectors: between a quarter and two
      fifths of keypoints share an exact location and scale with another keypoint
      in the same image. That sets a floor this module cannot read below.

      A FLOOR IS NOT A FIXED VALUE, AND HOW FAR ABOVE IT YOU SIT IS OFTEN
      REACHABLE FROM THE MATCHER. Tightening the matcher's acceptance moved this
      metric by nearly an order of magnitude on some captures and by almost
      nothing on others, over comparable changes to the view graph, and nothing
      upstream predicts which case you are in. So try the matcher dial first --
      it is one cheap re-run and it is reversible -- and conclude the detector is
      the binding constraint only after the dial has failed to move it. An
      earlier version of this text called the floor unreachable from here; that
      was true of the captures it was measured on and false of others, and read
      literally it sends you to an expensive detector backtrack instead.

      THE CEILING IS 0.2 RATHER THAN 0.1 FOR THAT REASON. The old 0.1 was breached
      routinely with nothing wrong (median 0.065, p90 0.137 over those runs) and
      cost readers backtracks that could not have worked. A learned detector with
      non-maximum suppression emits one keypoint per point and reads 0.0 on the
      same pipeline, so a high value here is a statement about the detector class
      you chose, not a defect to tune.

  max_track_length:
    direction: neutral
    meaning: >
      Longest surviving track. Approaching the image count on a sequential
      capture usually means real loop closure; exceeding what the view graph can
      support means over-merging.

  min_frame_observations:
    direction: higher_better
    healthy: [50, null]
    meaning: >
      Observations in the weakest frame. A frame below ~50 will fail to register
      and drop out of the reconstruction, regardless of the totals.

  inconsistent_rate:
    direction: lower_better
    healthy: [null, 0.05]
    meaning: >
      Fraction of merged groups that were observed twice in the same image, i.e.
      built from contradictory matches. Reads upstream: above the 0.05 ceiling the
      matcher is
      the problem, not this module. Detects OVER-merging only -- it is structurally
      blind to the opposite error, because splitting one physical point into
      several tracks produces no contradiction at all. `merge_sensitivity` is its
      counterpart.

  merge_headroom:
    direction: lower_better
    healthy: [null, 0.03]
    meaning: >
      Detector-free input only; null otherwise. How much long_track_fraction would
      RISE at a wider merge_eps_px, measured by rebuilding the tracks at 2x, 4x and
      8x and reporting the best -- together with the multiplier that achieved it,
      which the diagnostic quotes.

      NOT a plain doubling, which is what this said until the ladder was
      documented. A single 2x probe reads exactly 0.0 at every tolerance from 0.5
      to 3.0px on data where all of them are badly too tight, so it was silent
      precisely when the parameter was wrong by an order of magnitude. The fix
      landed in the adapter and not here, and a reader who trusted the old wording
      would misread the diagnostic's stated multiplier as a bug. Strongly positive means endpoints that are one physical point are
      being split into separate tracks -- the direction inconsistent_rate is
      structurally blind to. Near zero means the tolerance is on a plateau.
      Negative means doubling would start fusing distinct points, so the current
      value is already at or past the useful range. Read the two together: near
      zero on both is a well-set tolerance; positive headroom is under-merging;
      high inconsistent_rate is over-merging.


  track_survival_5:
    direction: higher_better
    healthy: [0.1, null]
    meaning: Fraction of tracks seen in 5+ views.

diagnostics:
  - code: too_few_tracks
    severity: error
    message: Too few tracks survived for reconstruction to start.
    suggested_actions:
      - "Widen the view graph first: raise the matcher's window under `pairing: sequential`, or switch it to `pairing: exhaustive`, which is what a plan should already have specified. Under exhaustive, window is inert and raising it changes nothing."
      - Raise the detector's max_keypoints.
      - Lower min_track_len to 2 if it was raised.
    see_also: tuning.md#track_count-below-200

  - code: mostly_two_view
    severity: warn
    message: Tracks rarely reach a third view; the view graph is the constraint.
    suggested_actions:
      - "Widen the view graph: under `pairing: sequential` raise the matcher's window; under `pairing: exhaustive` every pair already exists, window is inert, and the ceiling is co-visibility rather than pairing."
      - Check the matcher's graph_components and min_image_degree -- a chain of thin or isolated pairs cannot merge into long tracks.
      - Judge reach on long_track_fraction -- the fraction of tracks reaching a third view.
    see_also: tuning.md#long_track_fraction-below-03

  - code: high_conflict_rate
    severity: warn
    message: Many tracks were observed twice in the same image; matches contradict.
    suggested_actions:
      - "Learned matcher (LightGlue, SuperGlue): RAISE filter_threshold. Its documented 0.2-0.3 is a starting point, not a ceiling -- settled values across a capture sweep ran 0.5 to 0.7."
      - "Classical matcher (NN, FLANN): lower ratio_test toward 0.7 and confirm mutual is on."
      - "Stop when the view graph starts paying: watch pairs_matched against pairs_proposed, min_image_degree, and max_track_length. This rate keeps falling long after tightening has begun buying it by shrinking the graph."
    see_also: limitations.md#contradictory-tracks-come-from-the-matcher

  - code: under_merged
    severity: warn
    message: Doubling merge_eps_px would measurably lengthen tracks.
    suggested_actions:
      - Raise merge_eps_px and re-check merge_headroom.
      - inconsistent_rate cannot see this; it only detects over-merging.
      - "Guard the move with trifocal_transfer_px: this probe reads track LENGTH only, and a tolerance wide enough to fuse distinct points lengthens tracks while corrupting position."
    see_also: tuning.md#merge_headroom-above-003

  - code: weak_frames
    severity: warn
    message: At least one frame carries too few observations to register.
    suggested_actions:
      - Check the detector's keypoints_min for that frame.
      - "Link the frame to more neighbours: raise the matcher's window under `pairing: sequential`; under exhaustive the pairs already exist and the frame is thin because it shares little with the rest."
    see_also: tuning.md#min_frame_observations-below-50
