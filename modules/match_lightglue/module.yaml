name: FeatureMatchLightGlue
version: 1.6.0
kind: matching
summary: >
  Learned sparse matcher with adaptive depth and width. Reasons about the whole
  match set jointly rather than per-keypoint. GPU, weights baked into the image.

description: |
  The general-purpose learned matcher, and the right default whenever a GPU is
  available. Where Lowe's ratio test asks each keypoint independently whether its
  best match is distinctive, LightGlue attends over both keypoint sets together --
  which is exactly the information the ratio test discards, and why it wins on
  repeated structure, wide baselines and illumination change.

  It is also adaptive: easy pairs exit after fewer layers (`depth_confidence`) and
  unpromising keypoints are pruned early (`width_confidence`), so cost scales with
  difficulty rather than with a fixed budget.

  **The weight set must match the detector.** LightGlue is trained per descriptor
  type, and running SuperPoint weights over ALIKED descriptors produces confident,
  meaningless matches rather than an error. This module infers the right set from
  the features artifact's provenance and cross-checks the descriptor width, so the
  common case is safe; `weights` overrides it when you know better.

  Everything after the match itself -- geometric verification, view graph,
  planarity -- is identical to the classical matchers, so all three are directly
  comparable and only the correspondence step differs.

image: sfmstack/match-lightglue:1.6.0
entrypoint: adapter:run
resources:
  gpu: true
  min_ram_gb: 8
  # Hint for ~40 images, sequential window 1, 2048 keypoints. Adaptive depth makes
  # this vary widely with pair difficulty; exhaustive pairing is quadratic in
  # image count.
  expected_duration_s: 90
  timeout_s: 7200

consumes:
  scene: {type: scene/v1, required: true}
  features: {type: features/v1, required: true}

produces:
  matches: {type: pairwise_matches/v1}

params:
  weights:
    type: string
    default: auto
    enum: [auto, superpoint, aliked, sift, disk]
    description: >
      Which trained weight set to use. `auto` infers it from provenance. NOTE the
      name: this parameter is `weights`, not `features` -- `features` is the INPUT
      SLOT that carries the detector's artifact. Detector artifact notes used to say
      `features='superpoint'`, which this schema rejects outright since it allows no
      unknown keys.
    tuning: >
      Leave on `auto`. It reads the producing module from the features artifact and
      cross-checks the descriptor width, and it fails loudly when it cannot tell.
      Set it explicitly only for a detector this module does not know -- and be
      certain, because the wrong weights are SILENT: they produce matches, they are
      just meaningless. That silence is why `auto` is the default and why naming the
      weight set by hand is the riskier of the two options, not the more careful one:
      provenance cannot mistype a detector's name and you can.

  pairing:
    type: string
    default: sequential
    enum: [sequential, exhaustive]
    description: Which image pairs to match.
    tuning: >
      Same meaning as in the classical matchers. LightGlue is expensive per pair,
      so raise `window` before reaching for `exhaustive` on anything but a small set.

  window:
    type: integer
    default: 1
    minimum: 1
    maximum: 50
    description: "For `pairing: sequential`, match each image to the next `window` images."
    tuning: >
      The largest lever on track length. LightGlue tolerates much wider baselines
      than SIFT, so a larger window is genuinely productive here where it would find
      nothing with a classical matcher -- try 4-8 before concluding the capture is
      too sparse.

  filter_threshold:
    type: number
    default: 0.1
    minimum: 0.0
    maximum: 0.95
    description: Minimum match confidence. Higher gives fewer, stronger matches.
    tuning: >
      THE quality dial, and the single most consequential parameter on this module.
      0.1 is permissive by design because geometric verification follows.

      SWEEP ON THIS MODULE'S OWN cycle_merge_rate + cycle_split_rate. The criterion
      was the tracker's inconsistent_rate and that has been demoted, for two
      measured reasons. It is INSENSITIVE where it matters: on one capture the
      cycle sum fell 7.7x across a sweep while inconsistent_rate fell 1.17x, and on
      another inconsistent_rate moved 0.005 across a sweep whose registration went
      from 5 frames to 30, non-monotonically. It is also one stage away, so every
      point of a sweep costs a tracker run. The cycle terms are computed here, on
      this artifact, and they are the more sensitive instrument.

      DO NOT THRESHOLD ON THE CYCLE SUM. The constant relating it to the tracker's
      inconsistent_rate varies about fourfold between captures, so it prices a
      DIFFERENCE within one capture and does not price a level across captures.
      Sweep with it; confirm once at the settled value by running the tracker and
      reading inconsistent_rate.

      NOT inlier_ratio, which is actively misleading here. This dial used to
      condition the raise on a poor inlier_ratio; measured across a capture sweep,
      inlier_ratio was 0.93-0.99 -- excellent -- on every run that still produced a
      badly contradictory track table, and it RISES as you tighten, so it confirms
      whatever you just did. Two-view verification cannot see the error this dial
      fixes: a match displaced onto a repeated structure is epipolar-consistent by
      construction, which is the same reason the cycle terms need a THIRD view.

      THE USEFUL RANGE REACHES MUCH FURTHER THAN 0.2-0.3. That was the old
      guidance and it is roughly half of where the dial works. Settled values
      across six captures: 0.5, 0.5, 0.55, 0.6, 0.7 -- and on two of them the
      INHERITED value was already inside the old band and still unhealthy, so a
      reader obeying it had no next step. Treat 0.2-0.3 as where to start and sweep
      upward.

      WHERE TO STOP, which the old text did not say. Neither the cycle terms nor
      inconsistent_rate can be their own stopping rule -- both keep falling long
      after tightening has begun buying the improvement by deleting the graph, and
      a graph with fewer edges is a graph with fewer chains to contradict
      themselves. Stop when the graph starts paying:
      pairs_matched against pairs_proposed, min_image_degree, and the tracker's
      max_track_length -- one capture kept improving on both headline metrics at
      0.8 while quietly shedding two pairs and a degree, with graph_components
      still reading 1. Guard the last step with the tracker's
      trifocal_transfer_px, AND PRICE THE DIFFERENCE BEFORE BELIEVING IT. Two runs
      of this dial produce two different track tables, so the sampling error of
      either median is a floor rather than the answer; the yardstick is the range
      the metric covers across this dial's own sweep with nothing else changed.
      Measured across such a sweep on one capture the reading rose and fell with
      no monotone trend over a range wider than most of the differences readers
      try to interpret -- so a difference inside that range is noise, and the
      setting that minimises this metric is NOT always the one that minimises the
      cycle sum. See tracks/v1 on trifocal_transfer_px, and compare only at equal
      trifocal_triples.

  n_layers:
    type: integer
    default: 9
    minimum: 1
    maximum: 9
    description: Attention layers. Fewer is faster and weaker.
    tuning: >
      9 is the full model. Reducing it is a blunt speed lever and `depth_confidence`
      is the better one -- it lets easy pairs exit early while hard pairs still get
      the full stack. Drop to 5-7 only if you need a hard latency bound.

  depth_confidence:
    type: number
    default: 0.95
    minimum: -1.0
    maximum: 1.0
    description: Early-exit confidence. Lower exits sooner. -1 disables.
    tuning: >
      The good speed lever. Lower (0.9) stops more often at earlier layers on easy
      pairs, at a small accuracy cost that mostly does not appear on easy pairs by
      definition. Set -1 to force every pair through all layers when you are
      measuring accuracy rather than throughput.

  width_confidence:
    type: number
    default: 0.99
    minimum: -1.0
    maximum: 1.0
    description: Point-pruning confidence. Lower prunes more. -1 disables.
    tuning: >
      Complements depth_confidence by discarding unpromising keypoints between
      layers. Lower it (0.95) for speed on images with many keypoints. Disable with
      -1 when match count is scarce and you want every keypoint considered.

  flash:
    type: boolean
    default: true
    description: Use FlashAttention when available.
    tuning: >
      Leave on. It is faster and uses less memory with no accuracy effect, and
      falls back silently when unavailable -- including on CPU.

  geometric_model:
    type: string
    default: fundamental
    enum: [fundamental, homography, none]
    description: Two-view model used to reject outliers.
    tuning: >
      Keep `fundamental`. LightGlue's matches are good enough that `none` is
      tempting; resist it, because the failures that remain are the geometrically
      inconsistent ones this catches. `none` is still the right diagnostic setting
      for finding out whether verification is what is rejecting.

  ransac_threshold:
    type: number
    default: 3.0
    minimum: 0.5
    maximum: 20.0
    description: Inlier distance in pixels at working resolution.

  ransac_confidence:
    type: number
    default: 0.999
    minimum: 0.9
    maximum: 0.99999
    description: Confidence the estimated model is correct.

  min_matches:
    type: integer
    default: 15
    minimum: 8
    maximum: 1000
    description: Pairs with fewer verified matches are dropped from the view graph.

  measure_planarity:
    type: boolean
    default: true
    description: Also fit a homography per pair to detect degenerate geometry.

metrics:
  pairs_proposed:
    direction: neutral
    meaning: >
      Pairs the pairing policy offered, before any survived. The denominator for
      pairs_matched and weak_pairs; only the module knows it.
  pairs_matched:
    direction: higher_better
    healthy: [1, null]
    meaning: Pairs that survived min_matches.
  matches_per_pair:
    direction: higher_better
    healthy: [100, null]
    meaning: Mean verified matches on surviving pairs.
  min_matches_per_pair:
    direction: higher_better
    meaning: The weakest surviving link; tracks cross the graph through it.
  inlier_ratio:
    direction: higher_better
    healthy: [0.7, null]
    meaning: >
      Verified over raw. The healthy floor is HIGHER than for classical matchers
      (0.7 against 0.5) because LightGlue's raw matches are already filtered by a
      learned criterion. Below 0.5 suspect the weight set before anything else.
  graph_components:
    direction: lower_better
    healthy: [null, 1]
    meaning: Connected components of the view graph. Above 1 means a split model.
  largest_component_fraction:
    direction: higher_better
    healthy: [1.0, null]
    meaning: Fraction of images in the biggest component.
  min_image_degree:
    direction: higher_better
    healthy: [2, null]
    meaning: >
      The fewest surviving pairs any one image has -- the margin graph_components
      does not report. An image at degree 1 is connected and one pair from being
      lost, and every track through it crosses that single edge. Read it beside
      min_matches_per_pair: a thin edge on a high-degree image is redundant, the
      same thin edge on a degree-1 image is the graph.
  weak_pairs:
    direction: neutral
    healthy: null
    meaning: Pairs dropped for falling under min_matches.
  cycle_merge_rate:
    direction: lower_better
    nullable: true
    meaning: >
      Three-view chains that land on a different keypoint than the direct match,
      far enough to be different scene structure. The only reading on this module
      that sees a wrong-but-epipolar-consistent match -- two-view verification
      structurally cannot, because such a match satisfies the epipolar constraint
      by construction. Arrives one stage later as the tracker's inconsistent_rate.

      IT IS NOT THE FORECAST ON ITS OWN, and it used to be annotated as one. A
      capture read 0.0016 here -- clean -- and produced a track table 17%
      self-contradictory, because all of its signal sat in cycle_split_rate. Read
      the SUM of the two when asking what the tracker will report; read each
      separately when asking what to fix. High here means the matcher is admitting
      wrong correspondences: tighten it. Null when undefined rather than zero.

  cycle_split_rate:
    direction: lower_better
    nullable: true
    meaning: >
      The same test at a couple of pixels: one point detected twice. Shortens
      tracks rather than corrupting geometry, and dominates by volume.

      Its previous note said to judge on cycle_merge_rate and read this only as the
      cost in track length. That was measured wrong: on the capture whose track
      table came back 17% self-contradictory, this term carried all of the signal
      and the merge term read clean. High here with merge clean is a DETECTOR
      result -- several keypoints on one physical point, which no matcher parameter
      reaches, and which arrives at the tracker as an unreachable floor on its
      split_rate. Null when undefined rather than zero.

  planarity:
    direction: lower_better
    healthy: [null, 0.9]
    meaning: >
      Homography inliers over fundamental inliers, averaged over pairs. Near 1 the
      correspondences are explained by a PLANE as well as by a BASELINE, and a
      baseline is what every geometric stage downstream needs. Not a matching
      failure -- no matcher parameter fixes the underlying geometry, and
      inlier_ratio is often excellent alongside it.

      THE CEILING IS 0.9 AND IT IS DELIBERATELY HIGH. Across a seventeen-capture
      sweep this metric ran between roughly 0.4 and 0.87 on captures whose
      consecutive-pair degeneracy probe read exactly ZERO, and every one of them
      seeded an incremental reconstruction at ample parallax. A large flat surface
      filling the frame raises this number; it does not make a two-view bootstrap
      fail. A band any tighter fires on ordinary captures and buys solver switches
      that are not needed.

      THE BANDS. Below ~0.5, general 3D structure, nothing to do. ~0.5 to ~0.9, a
      real baseline with a dominant plane in view -- ordinary for a compact subject
      against a backdrop or a facade with some depth, and NOT a reason to change
      the solver; it is a reason to watch the triangulation angle rather than the
      reprojection error downstream, because a model can reproject beautifully
      while resolving almost no depth. Above ~0.9, triangulation is
      ill-conditioned. The middle region is a real and common state, not a gap
      between two bands.

      CHECK THE NUMBER IS NOT SLACK BEFORE READING THE BAND. It moves with
      ransac_threshold on identical inputs, it moves between matchers on identical
      features, and it moves with this module's own quality dial -- measured
      climbing 0.40 to 0.49 and 0.55 to 0.71 across two threshold sweeps, because
      tightening preferentially keeps the plane-consistent correspondences and
      strips the parallax-carrying ones. Sweep before believing a value near a
      boundary.

      IT CAN DISAGREE WITH THE PRE-STAGE PROBE, AND THE PROBE IS NOT THE
      AUTHORITY HERE. scene_analysis reports planar_dominance and
      pure_rotation_risk over CONSECUTIVE pairs only, an 11-pair boolean against
      this metric's mean over the whole verified graph. Captures have read ZERO on
      every consecutive pair while this read high over an exhaustive sweep: no
      adjacent pair is planar and most correspondences still land on one surface.
      A zero from the probe does not clear an exhaustive graph.

      NEITHER DOES A HIGH READING HERE CONDEMN THE CAPTURE. Across a seventeen-
      capture sweep this metric ran well above half on six captures whose
      consecutive-pair probe read exactly zero, and every one of them seeded an
      incremental reconstruction at ample parallax. The number rises whenever a
      large flat surface dominates the frame, which is a fact about the subject
      and not about whether a two-view bootstrap will condition. THE THRESHOLD
      THAT MATTERS IS ~0.9, published in the incremental pose module's
      limitations, above which a homography explains the pairs as well as epipolar
      geometry does. Between roughly 0.5 and that, the action is to watch the
      triangulation angle downstream, not to change solver.
  mean_match_score:
    direction: higher_better
    healthy: [0.5, null]
    meaning: >
      Mean LightGlue confidence over verified matches. A low value with a healthy
      inlier ratio is the signature of a mismatched weight set -- the geometry is
      consistent because the matches came from the same rigid scene, and the model
      is unsure because the descriptors are not what it was trained on.

diagnostics:
  - code: broken_chain
    severity: error
    message: The view graph is disconnected; reconstruction will come out in pieces.
    suggested_actions:
      - "Raise `window`, or switch to `pairing: exhaustive`."
      - LightGlue handles wide baselines well; if it cannot link them, they may not overlap.
    see_also: tuning.md#graph_components-above-1

  - code: low_inlier_ratio
    severity: warn
    message: Many of LightGlue's matches disagree with any two-view geometry.
    suggested_actions:
      - Verify `weights` matches the detector; the wrong set is silent.
      - Raise filter_threshold toward 0.2-0.3.
    see_also: tuning.md#inlier_ratio-below-05

  - code: low_confidence
    severity: warn
    message: LightGlue is unsure about the matches it produced.
    suggested_actions:
      - "Raise filter_threshold and re-read this. If the score climbs, it was a low-confidence tail rather than wrong weights."
      - "If it does not move, verify `weights` -- but `auto` resolves from the features artifact's provenance and refuses on an unknown producer, so a wrong set is only possible if it was named by hand."
    see_also: limitations.md#when-lightglue-is-not-the-answer

  - code: degenerate_geometry
    severity: warn
    message: A homography explains these pairs as well as epipolar geometry does.
    suggested_actions:
      - Widen the baseline -- raise `window` so pairs are further apart.
      - Expect triangulation to be ill-conditioned on the affected pairs.
    see_also: limitations.md#planar-and-rotation-only-captures
