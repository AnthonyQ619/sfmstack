name: SparseVerification
version: 1.1.0
kind: analysis
summary: >
  A veto on finished sparse models: rejects one that contradicts the matcher's
  correspondences it never used -- the one reading in the stack a wrong but
  self-consistent model cannot satisfy by construction. CPU-only; seconds.

description: |
  Runs after the final bundle adjustment, on every model, as a fixed step: the
  service runs it automatically whenever an optimization module produces a sparse
  model, and delivers the result beside the health profile.

  **It is a veto, not a judge.** Its one decision is whether to reject a model.
  It does not rank models that both pass: between two consistent solves of one
  capture, keeping the one with the lower reading kept the worse model more often
  than simply preferring the solve the pipeline prefers. Use it to throw a model
  out, never to pick between two it accepts. Its job is the case where the solve
  the pipeline prefers -- the wider second solve the service runs when points
  escape in the pose stage -- still led somewhere wrong.

  **Why it exists.** Every error reading a sparse model carries is computed over
  the observations the model kept, and bundle adjustment minimised exactly those.
  A model that settled into a wrong but self-consistent configuration therefore
  scores well on all of them. That was measured, not supposed: one capture solved
  several times from identical correspondences produced models an order of
  magnitude apart against reference geometry, and the badly wrong ones reported
  lower reprojection error, registered every frame, and satisfied the health
  profile better than the correct ones. Nothing a model publishes about itself
  could have chosen between them.

  **What it measures.** The matcher produces more correspondences than any model
  keeps, and the ones a model did not keep were never in its objective. For each
  matched pair this takes the correspondences that do not coincide with an
  observation of one model point in both images, measures their epipolar distance
  under the model's own relative pose, and takes the pair's median. The reading is
  the median over pairs, each weighted by how many held-out correspondences it
  has. No ground truth, no frame order, no second fit.

  **What it cannot see.** An error that every pair's correspondences allow. Two
  models of a shallow subject, one a few degrees wrong and one nearly exact, read
  the same -- on their own matches and on each other's. A clean reading means the
  model does not contradict the evidence. It does not mean the model is accurate.

  Any `pairwise_matches/v1` of the same scene is valid evidence: the model's own
  ancestor, which the service wires automatically, or another matcher's output,
  which was never in the model's objective at all.

image: sfmstack/sparse-verification:1.1.0
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 4
  # Dominated by reading the matches. Under a second on a detector pipeline;
  # a few seconds on a dense matcher's millions of correspondences.
  expected_duration_s: 15
  timeout_s: 1800

types:
  - type: custom/verification/v1
    summary: A sparse model's agreement with pairwise evidence it was not fit on.
    description: |
      One row per matched pair whose two images are both registered, plus the
      scalar metrics below. Written by SparseVerification. The per-pair array is the
      point when a model is contradicted: a contradiction confined to the pairs
      across one part of the capture says where the solve went wrong.
    files:
      pairs:
        required: true
        description: One row per scored pair.
        arrays:
          image_pair:
            required: true
            shape: [null, 2]
            dtype: [int32, int64]
            columns: [image_i, image_j]
            description: Scene frame indices of the pair.
          matches:
            required: true
            shape: [null]
            dtype: [int32, int64]
            description: The matcher's correspondences on this pair.
          held_out:
            required: true
            shape: [null]
            dtype: [int32, int64]
            description: >
              Of those, how many do not coincide with an observation of one model
              point in both images -- the correspondences the model was not fit on.
          residual_px:
            required: true
            shape: [null]
            dtype: [float32, float64]
            description: >
              Median epipolar (Sampson) distance of the held-out correspondences
              under the model's relative pose, in undistorted working-resolution
              pixels. NaN where the pair had too few held-out correspondences to
              give a stable median.
          residual_all_px:
            required: false
            shape: [null]
            dtype: [float32, float64]
            description: >
              The same distance over ALL of the pair's correspondences, not only
              the held-out ones. Never NaN where the pair was scored at all, and
              it rests on hundreds of correspondences where residual_px rests on
              tens. It is not independent of the solve and the veto does not read
              it; it is what supported_components is computed from, because that
              reading needs a per-pair median stable enough not to cut a sound
              pair loose by chance.
    invariants:
      - check: same_length
        args: {file: pairs, arrays: [image_pair, matches, held_out, residual_px]}
    metrics:
      heldout_residual_px:
        direction: lower_better
        nullable: true
        meaning: >
          The median over pairs of each pair's held-out epipolar residual, weighted
          by held-out count. Null when nothing was held out.
      held_out_share:
        direction: neutral
        meaning: Share of the matcher's correspondences on scored pairs the model did not use.
      pairs_verified:
        direction: neutral
        meaning: Pairs with enough held-out correspondences to contribute to the reading.
      heldout_residual_mrad:
        direction: lower_better
        nullable: true
        meaning: heldout_residual_px as an angle, divided by the median focal length.
      supported_components:
        direction: lower_better
        meaning: >
          Connected components the agreeing pairs induce on the registered cameras.
      supported_largest_share:
        direction: higher_better
        meaning: Share of registered cameras in the largest such component.
      supported_second_size:
        direction: lower_better
        meaning: Cameras in the second largest such component; zero when the model is in one piece.
      agreeing_pair_share:
        direction: higher_better
        nullable: true
        meaning: Share of scored pairs whose residual_all_px is within the inlier threshold.

consumes:
  scene: {type: scene/v1, required: true}
  sparse: {type: sparse_model/v1, required: true}
  matches: {type: pairwise_matches/v1, required: true}

produces:
  verification: {type: custom/verification/v1}

params:
  inlier_threshold_px:
    type: number
    default: 3.0
    minimum: 0.5
    maximum: 20.0
    description: Held-out residual above which the model is called contradicted, in working-resolution pixels.
    tuning: >
      Defaults to the pose estimator's own inlier threshold, so "agrees with the
      evidence" means what the pipeline already means when it accepts a
      correspondence. Scale it with the working resolution the way that threshold
      scales. It is not a fine dial: every model read so far sat either well under
      it or many times over it, and the one intermediate model -- a solve off by a
      fraction of a degree -- read under it. This catches a model that has drifted,
      not one that is slightly imprecise.

  min_held_out_per_pair:
    type: integer
    default: 20
    minimum: 5
    maximum: 1000
    description: Held-out correspondences a pair needs before its median counts.
    tuning: >
      A median over a handful of correspondences is one or two matches deciding a
      pair. Lower it only when `nothing_held_out` fires on a capture whose pairs
      are genuinely thin, and read the per-pair array before trusting the result.

metrics:
  heldout_residual_px:
    direction: lower_better
    healthy: [null, 3.0]
    meaning: >
      How far the correspondences this model was never fit on sit from its
      epipolar lines: each pair's median, then the median over pairs weighted by
      how many held-out correspondences each has. A correct model reads a fraction
      of a pixel; a model that drifted into a wrong but self-consistent
      configuration has been measured reading many times the pipeline's own inlier
      threshold while every self-reported rung called it healthy. The band's
      ceiling is inlier_threshold_px at its default. Null when nothing was held
      out, which means unverified, not verified.

      It measures CONSISTENCY WITH EVIDENCE, not accuracy. An error that every
      pair's correspondences allow -- measured on a shallow subject, where a model
      a few degrees wrong read the same as a nearly exact one -- is invisible here.

  held_out_share:
    direction: neutral
    meaning: >
      Of the matcher's correspondences on pairs whose images are both registered,
      the share that do not coincide with an observation of one model point in
      both images. This is the test set's size. A dense detector-free matcher
      leaves nearly all of its output unused; a detector pipeline leaves a smaller
      but substantial share. The held-out correspondences include ones the
      pipeline rejected, so they are not a clean sample -- the reading takes a
      median per pair for that reason.

  pairs_verified:
    direction: neutral
    meaning: >
      Pairs with at least min_held_out_per_pair held-out correspondences, which
      are the pairs the reading is made of. Read it beside the capture's pair
      count: a reading resting on a few pairs describes those pairs.

  heldout_residual_mrad:
    direction: lower_better
    nullable: true
    meaning: >
      heldout_residual_px divided by the capture's median focal length in the same
      pixels, so the reading is an angle and comparable between cameras. A pixel
      tolerance is not: the same pixel figure is several times the angular error on
      a wide-angle camera as on a long lens, which is why a px ceiling cannot be
      read across captures of different focal length. See
      plan/scene_to_pipeline.md trap 11.

      **Deliberately banded nowhere.** The veto is the px threshold, and a second
      band here would contradict it: across the corpus this spans more than an
      order of magnitude, and the capture at the top of that range sits comfortably
      inside the px ceiling it is judged by. Any mrad ceiling tight enough to be
      interesting would fail a capture the module passes.

      **Read it anyway on a short-focal capture, and read it beside the veto.**
      Measured over five families spanning well over an order of magnitude of focal
      length, against thirteen delivered models known to be wrong: the px veto
      caught two of them and this reading caught nearly all, and every model the
      veto missed came from a wide-angle camera where its slack is many times the
      angle the same pixel figure is on a long lens. It fires on roughly one good
      model in five, so it is a reason to look again rather than a second veto --
      which is why no band is published here and why the absence is not an
      oversight. See plan/pose.md and evidence/sparse-pose-2026-09.md.

  supported_components:
    direction: lower_better
    healthy: [null, 1]
    meaning: >
      Take only the pairs whose held-out correspondences AGREE with the model --
      residual within inlier_threshold_px -- and count the connected components
      they induce on the registered cameras. One component means the model rests
      on a single connected body of evidence. More than one means the model is a
      set of internally consistent pieces joined across pairs its own geometry
      contradicts, which is the shape of a wrong-but-self-consistent solve and is
      invisible to registration, reprojection error, and to this module's own
      weighted-median reading, because an average over pairs cannot express a
      graph property.

      Measured across the corpus captures that delivered: all but one read exactly
      1, and the exception read 2 with a single camera hanging off. The ceiling is
      set from that. Per-capture figures live in the campaign file rather than
      here, deliberately -- a share or a residual carried across from another
      capture is a threshold nobody fitted.

  agreeing_pair_share:
    direction: higher_better
    nullable: true
    meaning: >
      Of the pairs this module scored, the share whose all-correspondence residual
      is within inlier_threshold_px -- the edges supported_components is built
      from. It is the same evidence as the component count without the graph
      structure, and the two come apart: across the corpus it ranges from roughly
      seven tenths up to one, and the capture at the BOTTOM of that range reads one
      component holding every camera. So a low share is not itself a fault; it is
      context for the component reading, not a second version of it.

  supported_largest_share:
    direction: higher_better
    meaning: >
      Cameras in the largest agreeing component, over registered cameras. Read it
      with supported_components, which alone cannot distinguish one stray camera
      from a model in halves.

      **Deliberately banded nowhere, because the quantity is camera-count
      dependent and so cannot carry a fixed floor.** One stray camera on a capture
      of a few dozen views leaves a share in the high nineties; the same stray on a
      capture of a dozen or so leaves it several points lower. Same situation,
      opposite sides of any fixed threshold, which would charge a small capture for
      being small. supported_second_size is the scale-free form and is what the
      diagnostic gates on.

  supported_second_size:
    direction: lower_better
    healthy: [null, 1]
    meaning: >
      Cameras in the SECOND largest agreeing component -- zero when the model is in
      one piece. This is the reading that separates a stray from a split: one
      camera whose agreeing pairs do not reach the rest occurs in the reference
      corpus on a capture that delivered, while two or more cameras forming their
      own island is a model in pieces. Unlike the share, it does not change meaning
      with the number of cameras.

      Both these readings describe consistency with evidence and not accuracy: a
      capture whose matcher produced many wrong pairs can read clean here while the
      averaging survived them, so a poor reading is a reason to look, not a verdict
      that the model is wrong.

  supported_stray_cameras:
    direction: lower_better
    healthy: [null, 1]
    meaning: >
      Registered cameras OUTSIDE the largest agreeing component -- every piece but
      the first, added together. This is what the diagnostic gates on, and it is
      supported_second_size widened: the second piece is always among the strays,
      so a split this reading passes is one that reading passes too.

      The two come apart on one shape. Several cameras that each fail to reach the
      main body and do not reach EACH OTHER either leave pieces of size 1, 1, 1 --
      a second size of 1, which reads as a single stray and passes, while three
      cameras are in fact unsupported. That is a scattered registration failure
      rather than a stray, and counting the strays is what makes it visible.

      One stray occurs in the reference corpus on a capture that delivered, which
      is where the ceiling comes from; two is where the diagnostic fires.

diagnostics:
  - code: contradicted_by_held_out_evidence
    severity: error
    message: Correspondences the model was never fit on sit beyond the inlier threshold from its epipolar lines.
    suggested_actions:
      - "If the pose stage reported escaped points, the service has already re-solved this chain at a wider window: read `second_solve` on the same result before doing anything else. Otherwise solve again from the same inputs before changing anything. A capture can have more than one stable answer, and a second solve that reads clean here is the model to keep."
      - "Do not choose between models on reprojection error or registration. A wrong model that is self-consistent satisfies both, and has been measured satisfying them better than the correct one."
      - "Read the per-pair residual_px array: a contradiction confined to the pairs across one part of the capture says where the solve went wrong."
    see_also: limitations.md#what-a-contradiction-means
  - code: model_not_supported_by_its_own_evidence
    severity: error
    message: The pairs that agree with the model do not connect it; it is internally consistent pieces joined across pairs it contradicts.
    suggested_actions:
      - "Read the per-pair residual_px array: the pairs bridging two pieces are where the model and its evidence part company, and they are the candidates for wrong correspondences that verified anyway."
      - "On a scene with repeated or instanced structure this is the expected shape of a self-matching failure. Rotation averaging distributes one wrong relative pose over the whole graph, so the remedy is upstream in the matcher rather than in a threshold here."
      - "Compare against another matcher's pairwise_matches of the same scene. If the pieces persist across matchers the capture is at fault; if they move, the matcher is."
    see_also: limitations.md#a-model-can-be-in-pieces-and-the-residual-will-not-say-so
  - code: nothing_held_out
    severity: warn
    message: No pair had enough correspondences the model did not already use; the model is unverified, not verified.
    suggested_actions:
      - "Supply another matcher's pairwise_matches of the same scene as `matches`. A different matcher's evidence was never in this model's objective."
      - "Lowering min_held_out_per_pair admits pairs whose median rests on a handful of correspondences; read the per-pair array before trusting it."
    see_also: limitations.md#when-nothing-is-held-out
