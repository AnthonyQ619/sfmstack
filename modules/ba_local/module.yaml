name: BundleAdjustmentLocal
version: 1.2.1
kind: optimization
summary: >
  Bundle adjustment over a window of cameras, holding the rest of the model fixed.
  CPU-only, via pycolmap.

description: |
  Global bundle adjustment costs grow with the whole model; local BA refines a
  contiguous window of cameras and the points they see, and holds everything else
  constant. On a long sequence that is the difference between a refinement you can
  afford to run repeatedly and one you can run once.

  It is not a cheaper substitute for global BA. The cameras outside the window are
  fixed, so accumulated drift *between* distant parts of the model cannot be
  corrected — only the local geometry is improved. The usual shape is: local BA
  repeatedly during registration, global BA once at the end.

  The predecessor implemented this by taking a `BundleAdjustmentOptimizerLocal`
  instance as a constructor argument to the pose estimator, so one module's
  behaviour was a function of another module's object. Here it is an ordinary
  module and the alternation is expressed at the orchestrator level, which the
  driving agent can drive without either module knowing about the other.

  `anchor` decides which cameras are constant. Fixing the cameras outside the
  window is what makes the problem small; fixing nothing would be global BA with
  extra steps, and pycolmap requires at least two fixed cameras to pin the gauge.

image: sfmstack/ba-local:1.2.1
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 8
  expected_duration_s: 40
  timeout_s: 3600

consumes:
  scene: {type: scene/v1, required: true}
  sparse: {type: sparse_model/v1, required: true}

produces:
  sparse: {type: sparse_model/v1}

params:
  window_size:
    type: integer
    default: 8
    minimum: 2
    maximum: 500
    description: Cameras to refine. The rest are held fixed.
    tuning: >
      The cost/benefit dial. Cost grows roughly with the square of the window for
      the dense parts of the solve. 8 is a reasonable working value; below ~4 there
      is too little freedom for the solve to do anything, and above ~30 you are
      approaching global BA and should use that instead.

  anchor:
    type: string
    default: last
    enum: [last, first, largest_error]
    description: Where the window sits in the sequence.
    tuning: >
      `last` refines the most recently registered cameras, which is the incremental
      SfM use case. `first` refines around the seed pair, useful when you suspect
      the initialisation. `largest_error` centres the window on the camera with the
      worst mean reprojection error, which is the right choice when running this
      as a targeted repair rather than as part of a sweep.

  max_iterations:
    type: integer
    default: 50
    minimum: 1
    maximum: 1000
    description: Ceres iteration cap.
    tuning: >
      Lower than the global default because a local problem converges faster and
      because this is meant to be run repeatedly. Check `converged` before raising.

  robust_loss:
    type: boolean
    default: true
    description: Cauchy loss rather than plain squared error.
    tuning: Leave on, for the same reason as in global BA.

  loss_scale:
    type: number
    default: 1.0
    minimum: 0.01
    maximum: 100.0
    description: Cauchy loss scale, in pixels.

  min_track_length:
    type: integer
    default: 3
    minimum: 2
    maximum: 50
    description: >
      Points seen in fewer views are REMOVED FROM THE OUTPUT MODEL, not merely
      held out of the solve. Read point_count, never points_optimized: the two
      are equal by construction, so points_optimized cannot show you what this
      cost.
    tuning: >
      Defaults to 3 here rather than 2, unlike global BA. In a window most points
      are seen by few cameras, and a two-view point inside the window contributes
      nothing a local solve can use.

metrics:
  min_frame_points:
    meaning: >
      The fewest observations any REGISTERED camera contributes to the refined
      model. registered_images says a camera has a pose; this says whether it has
      any structure. On the final artifact of the pipeline that distinction is the
      one most worth having.
    direction: higher_better
    healthy: [50, null]
  two_view_fraction:
    meaning: >
      Share of points seen in exactly two views. A two-view point is exactly
      determined, so its residual is near zero by construction -- which means
      mean_reprojection_error on a half-two-view cloud is half made of numbers that
      cannot carry error. Read this before comparing an error against anything.
    direction: lower_better
    healthy: [null, 0.6]
  p95_reprojection_error:
    meaning: >
      The tail of the per-point error distribution, taken over the points that
      stayed in the image -- an escaped point's error is not a measurement and is
      counted in escaped_points instead -- and suppressed if the solve diverged.
      The mean runs about 1.5x the median here; a mean close to p95 is a
      uniformly mediocre model, a mean far below it is a good model with a few bad
      points. Those two want different responses and the mean alone cannot separate
      them.
    direction: lower_better
    healthy: [null, 2.0]
  p05_triangulation_angle:
    meaning: >
      The weak end of the parallax distribution on the model this module SHIPS, not
      the one it was given. Bundle adjustment moves structure, so the input's
      conditioning is stale the moment the solve finishes -- and this artifact is
      usually the last one in the sparse pipeline, so a consumer that needs to know
      how well-conditioned the geometry is has nowhere else to read it. Points near
      the bottom of this distribution reproject well while sitting at an
      ill-determined depth, which is invisible in any reprojection metric.
    direction: higher_better
    healthy: [1.0, null]
  reprojection_error_before:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: Mean pixel error over the WHOLE model on entry.
  reprojection_error_after:
    direction: lower_better
    healthy: [null, 1.0]
    meaning: >
      Mean pixel error over the whole model after the solve. Improves less than
      global BA does by construction -- most of the model was not touched.
  window_error_before:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: Mean error over the refined cameras only, on entry.
  window_error_after:
    direction: lower_better
    healthy: [null, 1.0]
    meaning: >
      Mean error over the refined cameras after the solve. THE metric for this
      module -- the global figure dilutes it with cameras that were held fixed.
  cameras_refined:
    direction: neutral
    meaning: Cameras in the window. Fewer than window_size means the model is smaller.
  cameras_fixed:
    direction: neutral
    meaning: >
      Cameras held constant. At least 2 is required to pin the gauge; if this is 2
      on a large model, the window covered nearly everything and global BA is the
      honest choice.
  points_optimized:
    direction: higher_better
    healthy: [50, null]
    meaning: Points visible in the window after min_track_length filtering.
  converged:
    direction: higher_better
    healthy: [1, null]
    meaning: 1 when Ceres reported CONVERGENCE, 0 otherwise.

  point_count:
    direction: higher_better
    healthy: [50, null]
    meaning: >
      Surviving 3D points. Required by sparse_model/v1: it describes the artifact,
      where the before/after pair describes this module's own work.

  observation_count:
    direction: higher_better
    healthy: [100, null]
    meaning: Total 2D observations across all points.

  mean_track_length:
    direction: higher_better
    healthy: [2.5, null]
    meaning: >
      Observations per point. At 2.0 nothing is multi-view constrained, which is
      the condition under which bundle adjustment has least to work with.

  mean_reprojection_error:
    direction: lower_better
    healthy: [null, 1.0]
    meaning: >
      Mean pixel error after the solve, at working resolution, over the points
      that stayed in the image; escaped points are counted in escaped_points. The
      same number as reprojection_error_after, under the name every
      sparse_model/v1 producer uses.

  registered_images:
    direction: higher_better
    healthy: [3, null]
    meaning: >
      Cameras carrying a valid pose in this model. Required by sparse_model/v1:
      point_count and reprojection error are not comparable between models with
      different camera counts, and this is what says whether they are.

  escaped_points:
    meaning: >
      Points that ended the solve with a reprojection error larger than the image
      itself -- an error no point can have and still project into the image it was
      observed in. They are counted here and left out of every error reading on
      this artifact, the window readings included, because one of them is enough
      to own a mean. A point on near-parallel rays has a barely constrained depth
      and can wander during the solve; under the robust loss its cost flattens as
      it leaves, so its pull on the cameras stays bounded, and an escapee says
      nothing about the poses either way. Escapees numerous enough to reach the
      published tail percentile, in the model or in the window, are what this
      module calls a diverged solve.
    direction: lower_better
    healthy: [null, 0]

diagnostics:
  - code: bundle_adjustment_diverged
    severity: error
    message: Escaped points reached the published tail, in the model or the window, or the tail error grew by orders of magnitude; every error metric is suppressed.
    suggested_actions:
      - "Do NOT raise max_iterations -- a diverging solve diverges further."
      - "A narrow window is a cause rather than a symptom: a point the window cannot constrain is what blows the solve up. Widen window_size or use BundleAdjustmentGlobal."
      - "Read the input model's p05_triangulation_angle."
    see_also: limitations.md#thin-windows
  - code: points_escaped
    severity: warn
    message: Some points left the image during the solve; they are counted in escaped_points and left out of every error reading, and the solve did not diverge.
    suggested_actions:
      - "Judge the model on the readings that ARE published. The median and the tail did not move, which is exactly what separates an escaped point from a diverged solve."
      - "Under the robust loss an escapee's pull on the cameras is bounded, so it says nothing about the poses either way. With robust_loss off, nothing bounds it."
      - "The escapees are still in the artifact, with their values in points/error. Filter on that array before measuring anything else from the cloud."
      - "A narrow window leaves points it cannot constrain, which is where escapees come from here. Widen window_size, or use BundleAdjustmentGlobal."
    see_also: limitations.md#an-escaped-point-is-not-a-diverged-solve
  - code: window_covers_model
    severity: info
    message: The window covers nearly the whole model; this is global BA with extra steps.
    suggested_actions:
      - Use BundleAdjustmentGlobal instead; it will do the same work and fix the gauge properly.
      - Or lower window_size if you meant to refine a part.
    see_also: tuning.md#when-to-use-global-ba-instead

  - code: did_not_converge
    severity: warn
    message: The solver stopped without converging -- which on this stack is usually bookkeeping, not a bad model.
    suggested_actions:
      - "Raise max_iterations only if `iterations` is AT OR NEAR the cap. It reports cap+1 on a capped run, so it never equals the cap and 'stopped at the cap' is not a test that passes."
      - "If it stalled well BELOW the cap, more iterations will not help. The robust loss is the usual cause: a Cauchy loss can keep the trust-region step from meeting Ceres' tolerance on a model already at its optimum."
      - "A converged flag has been measured worth nothing here: capped and converged solves of one problem agreed to four decimal places every time. Read reprojection_error_after and treat this as bookkeeping unless the error is also bad."
      - "Check reprojection_error_before; local BA cannot rescue a badly wrong model."
    see_also: tuning.md#converged-is-0

  - code: no_improvement
    severity: info
    message: The window was already at a local minimum.
    suggested_actions:
      - Nothing, if window_error_after is low.
      - "Try anchor: largest_error to refine somewhere that needs it."
    see_also: tuning.md#window_error-does-not-move

  - code: points_dropped_by_min_track_length
    severity: warn
    message: min_track_length removed points from the output model, not just from the solve.
    suggested_actions:
      - "Read point_count, not points_optimized -- points_optimized counts the window, so it cannot separate a dropped point from one outside the window."
      - "The deletion is correct: a point held out of the solve would keep the input's gauge while everything else moved."
      - "This module defaults to 3 where the global one defaults to 2, so it discards more of the same cloud by default. Read two_view_fraction on the input first."
    see_also: tuning.md#min_track_length-defaults-to-3-here-not-2
  - code: too_few_points
    severity: warn
    message: The window contains very few points to optimise.
    suggested_actions:
      - Raise window_size so more shared structure is included.
      - Lower min_track_length to 2.
    see_also: limitations.md#thin-windows
