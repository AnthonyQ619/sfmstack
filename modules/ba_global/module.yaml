name: BundleAdjustmentGlobal
version: 1.2.1
kind: optimization
summary: >
  Ceres bundle adjustment over the whole reconstruction, refining every pose and
  every point at once. CPU-only, via pycolmap.

description: |
  The only stage that revisits earlier decisions. Everything upstream is greedy --
  the pose estimator registers images one at a time and never moves a point once
  it is accepted -- so drift accumulates and nothing corrects it. Global bundle
  adjustment minimises reprojection error over all cameras and all points
  simultaneously, which is what turns a chain of locally-consistent estimates into
  one globally-consistent model.

  Run it after any incremental pose estimator. On a well-conditioned scene the
  improvement is modest; on a long sequence it is the difference between a usable
  model and a banana.

  Observations in `sparse_model/v1` are undistorted pixels, so the COLMAP cameras
  built here are PINHOLE with no distortion terms. That is not an approximation --
  the distortion was removed once, upstream, and re-modelling it here would apply
  it twice.

  Also writes a `colmap` sidecar (cameras/images/points3D.bin) beside the npz, so
  a pycolmap consumer can open the reconstruction natively. The npz stays
  authoritative; the sidecar is a convenience, and a consumer without pycolmap
  loses nothing but the convenience.

image: sfmstack/ba-global:1.2.1
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 8
  # Scales with observations, not images. A few thousand points converges in
  # seconds; a hundred thousand takes minutes.
  expected_duration_s: 120
  timeout_s: 7200

consumes:
  scene: {type: scene/v1, required: true}
  sparse: {type: sparse_model/v1, required: true}

produces:
  sparse: {type: sparse_model/v1}

params:
  max_iterations:
    type: integer
    default: 300
    minimum: 1
    maximum: 1000
    description: Ceres iteration cap.
    tuning: >
      More binding than it looks. On the small-object reference capture the solve needs 154
      iterations to converge; the original default of 100 stopped it early, and
      because the reprojection error was identical either way (0.2531) nothing but
      the `converged` flag revealed it. Check `converged` before assuming a solve
      finished, and raise this when it is 0 and `iterations` sits at the cap.

  robust_loss:
    type: boolean
    default: true
    description: Cauchy loss on residuals rather than plain squared error.
    tuning: >
      Leave on. Squared error lets a handful of gross outliers dominate the whole
      solve, and there are always some -- a mistriangulated point or a wrong
      match survives the upstream filters more often than not. Turn it off only
      once you trust the input completely and want the last fraction of accuracy.

  loss_scale:
    type: number
    default: 1.0
    minimum: 0.01
    maximum: 100.0
    description: Cauchy loss scale, in pixels.
    tuning: >
      Roughly "residuals beyond this many pixels stop being trusted". Set it near
      the reprojection error you expect from good observations -- 1-2px at a
      typical working resolution. Too large and the robust loss does nothing; too
      small and real structure is treated as outlying.

  refine_focal_length:
    type: boolean
    default: false
    description: Let the solver adjust focal lengths.
    tuning: >
      Off by default because a supplied calibration is usually better than what
      BA recovers from a short sequence, and a wrong focal length absorbs pose
      error into itself and looks like convergence. Turn it on when the
      calibration is untrusted or absent, and expect the refined K in the output
      artifact's `intrinsics` file.

  refine_principal_point:
    type: boolean
    default: false
    description: Let the solver adjust principal points.
    tuning: >
      Off, and more strongly so than focal length. The principal point is weakly
      observable from a short sequence and trades off directly against translation;
      refining it on limited data usually moves error around rather than removing it.

  min_track_length:
    type: integer
    default: 2
    minimum: 2
    maximum: 50
    description: >
      Points seen in fewer views are REMOVED FROM THE OUTPUT MODEL, not merely
      held out of the solve. Read point_count, never points_optimized: the two
      are equal by construction, so points_optimized cannot show you what this
      cost.
    tuning: >
      3 is a defensible tightening: a two-view point has exactly as many
      constraints as unknowns and BA can only slide it along its ray, so it adds
      cost without adding information. Check `points_optimized` afterwards.

metrics:
  min_frame_points:
    meaning: >
      The fewest observations any REGISTERED camera contributes to the refined
      model. registered_images says a camera has a pose; this says whether it has
      any structure. On the final artifact of the pipeline that distinction is the
      one most worth having.
    direction: higher_better
    healthy: [50, null]
  two_view_fraction:
    meaning: >
      Share of points seen in exactly two views. A two-view point is exactly
      determined, so its residual is near zero by construction -- which means
      mean_reprojection_error on a half-two-view cloud is half made of numbers that
      cannot carry error. Read this before comparing an error against anything.
    direction: lower_better
    healthy: [null, 0.6]
  p95_reprojection_error:
    meaning: >
      The tail of the per-point error distribution, taken over the points that
      stayed in the image -- an escaped point's error is not a measurement and is
      counted in escaped_points instead -- and suppressed if the solve diverged.
      The mean runs about 1.5x the median here; a mean close to p95 is a
      uniformly mediocre model, a mean far below it is a good model with a few bad
      points. Those two want different responses and the mean alone cannot separate
      them.
    direction: lower_better
    healthy: [null, 2.0]
  p05_triangulation_angle:
    meaning: >
      The weak end of the parallax distribution on the model this module SHIPS, not
      the one it was given. Bundle adjustment moves structure, so the input's
      conditioning is stale the moment the solve finishes -- and this artifact is
      usually the last one in the sparse pipeline, so a consumer that needs to know
      how well-conditioned the geometry is has nowhere else to read it. Points near
      the bottom of this distribution reproject well while sitting at an
      ill-determined depth, which is invisible in any reprojection metric.
    direction: higher_better
    healthy: [1.0, null]
  estimated_focal_ratio:
    meaning: >
      The refined focal length over the one that was supplied, averaged across
      registered cameras. Present only when intrinsics were refined. This module
      WRITES intrinsics that every downstream consumer prefers over the scene's,
      and published nothing about them until now -- so a refinement that gave a
      one-lens rig twelve focal lengths was invisible unless a reader dumped two
      artifacts and divided. A consistent same-sign pull is a calibration
      disagreement worth investigating; read focal_spread to tell that from noise.
    direction: neutral
    healthy: [0.95, 1.05]
  focal_spread:
    meaning: >
      Largest refined focal ratio minus smallest, across registered cameras.
      On a rig with one physical lens this should be ~0. Anything material means
      the solve is modelling one camera as many and absorbing pose error into the
      extra freedom.
    direction: lower_better
    healthy: [null, 0.01]
  reprojection_error_before:
    direction: lower_better
    healthy: [null, 2.0]
    meaning: Mean pixel error on entry, at working resolution.

  reprojection_error_after:
    direction: lower_better
    healthy: [null, 1.0]
    meaning: >
      Mean pixel error after the solve. The number to judge the reconstruction on.
      Above ~1.5 at a normal working resolution, something upstream is wrong.

  error_reduction:
    direction: higher_better
    healthy: [0.0, null]
    meaning: >
      Fraction of reprojection error removed. Near zero means the input was
      already at a local minimum -- fine if the error was low, and a sign the
      solve is stuck if it was high. NEGATIVE means the robust loss traded mean
      error for outlier resistance, which is not necessarily wrong.

  points_optimized:
    direction: higher_better
    healthy: [100, null]
    meaning: Points included in the solve after min_track_length filtering.

  observations_optimized:
    direction: higher_better
    healthy: [300, null]
    meaning: Residual blocks; the size of the problem actually solved.

  iterations:
    direction: neutral
    meaning: Ceres iterations used. At the cap, the solve did not converge.

  converged:
    direction: higher_better
    healthy: [1, null]
    meaning: 1 when Ceres reported CONVERGENCE, 0 otherwise.

  point_count:
    direction: higher_better
    healthy: [50, null]
    meaning: >
      Surviving 3D points. Required by sparse_model/v1: it describes the artifact,
      where the before/after pair describes this module's own work.

  observation_count:
    direction: higher_better
    healthy: [100, null]
    meaning: Total 2D observations across all points.

  mean_track_length:
    direction: higher_better
    healthy: [2.5, null]
    meaning: >
      Observations per point. At 2.0 nothing is multi-view constrained, which is
      the condition under which bundle adjustment has least to work with.

  mean_reprojection_error:
    direction: lower_better
    healthy: [null, 1.0]
    meaning: >
      Mean pixel error after the solve, at working resolution, over the points
      that stayed in the image; escaped points are counted in escaped_points. The
      same number as reprojection_error_after, under the name every
      sparse_model/v1 producer uses.

  registered_images:
    direction: higher_better
    healthy: [3, null]
    meaning: >
      Cameras carrying a valid pose in this model. Required by sparse_model/v1:
      point_count and reprojection error are not comparable between models with
      different camera counts, and this is what says whether they are.

  escaped_points:
    meaning: >
      Points that ended the solve with a reprojection error larger than the image
      itself -- an error no point can have and still project into the image it was
      observed in. They are counted here and left out of every error reading on
      this artifact, because one of them is enough to own a mean: a single escapee
      once made this module call its most accurate model unusable. A point on
      near-parallel rays has a barely constrained depth and can wander during the
      solve; under the robust loss its cost flattens as it leaves, so its pull on
      the cameras stays bounded, and an escapee says nothing about the poses either
      way. Escapees numerous enough to reach the published tail percentile are what
      this module calls a diverged solve.
    direction: lower_better
    healthy: [null, 0]

diagnostics:
  - code: bundle_adjustment_diverged
    severity: error
    message: Escaped points reached the published tail, or the tail error grew by orders of magnitude; every error metric is suppressed.
    suggested_actions:
      - "Do NOT raise max_iterations -- a diverging solve diverges further."
      - "The cause is under-constrained structure: two-view points, near-parallel rays, or points placed by a depth prior and never verified."
      - "Read the input model's two_view_fraction and p05_triangulation_angle."
      - "If the input came from a learned prior, triangulate the same tracks geometrically and refine that instead."
    see_also: limitations.md#it-cannot-escape-a-bad-local-minimum
  - code: points_escaped
    severity: warn
    message: Some points left the image during the solve; they are counted in escaped_points and left out of every error reading, and the solve did not diverge.
    suggested_actions:
      - "Judge the model on the readings that ARE published. The median and the tail did not move, which is exactly what separates an escaped point from a diverged solve."
      - "Under the robust loss an escapee's pull on the cameras is bounded, so it says nothing about the poses either way. With robust_loss off, nothing bounds it."
      - "The escapees are still in the artifact, with their values in points/error. Filter on that array before measuring anything else from the cloud."
      - "To stop them forming, bound the escape where it starts: the triangulator's max_landmark_distance removes a localised escaping tail, where raising the global angle filter charges the whole cloud for it."
    see_also: limitations.md#an-escaped-point-is-not-a-diverged-solve
  - code: points_dropped_by_min_track_length
    severity: warn
    message: min_track_length removed points from the output model, not just from the solve.
    suggested_actions:
      - "Read point_count, not points_optimized -- the two are equal here by construction."
      - "The deletion is correct: a point held out of the solve would keep the input's gauge while everything else moved."
      - "min_track_length: 2 keeps everything, and two-view points do measurably improve through the solve."
    see_also: tuning.md#min_track_length
  - code: refined_focal_disagrees_across_cameras
    severity: warn
    message: Intrinsic refinement gave a one-calibration scene a different focal length per camera.
    suggested_actions:
      - "A fixed lens cannot have one focal length per frame; this is pose error absorbed into intrinsics."
      - "Turn refine_focal_length off. The refined K is written into this artifact and every consumer prefers it."
      - "Judge on estimated_focal_ratio and focal_spread, never on the reprojection error, which improves either way."
    see_also: tuning.md#refining-intrinsics
  - code: did_not_converge
    severity: warn
    message: The solver stopped without converging -- which on this stack is usually bookkeeping, not a bad model.
    suggested_actions:
      - "Raise max_iterations only if `iterations` is AT OR NEAR the cap. It reports cap+1 on a capped run, so it never equals the cap and 'stopped at the cap' is not a test that passes."
      - "If it stalled well BELOW the cap, more iterations will not help. The robust loss is the usual cause: a Cauchy loss can keep the trust-region step from meeting Ceres' tolerance on a model already at its optimum."
      - "A converged flag has been measured worth nothing here: capped and converged solves of one problem agreed to four decimal places every time. Read reprojection_error_after and treat this as bookkeeping unless the error is also bad."
      - "Check reprojection_error_before -- BA cannot rescue a badly wrong input."
      - "Turn refine_focal_length off if it was on; free intrinsics destabilise short sequences."
    see_also: tuning.md#converged-is-0

  - code: no_improvement
    severity: info
    message: Bundle adjustment changed almost nothing.
    suggested_actions:
      - Nothing, if reprojection_error_after is already low.
      - If the error is high and unchanged, the input is at a bad local minimum; fix the poses.
    see_also: tuning.md#error_reduction-near-zero

  - code: still_high_error
    severity: warn
    message: Error remains high after optimisation.
    suggested_actions:
      - Tighten the triangulator's max_reprojection_error and min_triangulation_angle_deg.
      - Check the tracker's inconsistent_rate -- wrong tracks cannot be optimised away.
    see_also: limitations.md#what-bundle-adjustment-cannot-fix
