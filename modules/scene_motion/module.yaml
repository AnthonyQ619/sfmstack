name: SceneMotion
version: 1.3.0
kind: analysis
summary: >
  Dense optical flow between image pairs, summarised into camera-motion scores
  and the two classic degeneracy tests -- planar dominance and pure rotation.
  GPU required.

description: |
  The GPU half of scene analysis. `SceneTriage` says what the images look like;
  this says how the camera moved between them, which is the other input to
  whether a reconstruction is possible at all.

  RAFT-large dense flow over pairs, normalised by the image diagonal so the
  numbers do not depend on resolution, then summarised two ways:

  **motion** -- is there enough parallax to triangulate? `low_baseline_risk`
  answers that, and `variability` says whether the answer holds across the whole
  capture or only its middle.

  The opposite failure -- too much displacement between frames -- is reported as
  the raw `high_motion_tail` and `overall_magnitude` rather than as a risk
  fraction. **Read both. They are the most predictive numbers this module
  produces.** Taken to a sparse model across fourteen captures, the highest
  readings on either are exactly the captures whose view graph fragments under a
  classical detector and ratio-test matcher, with a clean gap below them. The
  reason is that these measure ADJACENT-frame overlap, and a capture that covers
  ground quickly between adjacent frames shares less between non-adjacent ones --
  which is what an exhaustive view graph is made of.

  **degeneracy** -- the two configurations that make a correct pipeline produce a
  wrong answer rather than no answer:

  - `planar_dominance`: a homography explains the correspondences at least as
    well as a fundamental matrix, by GRIC. Essential-matrix decomposition is then
    ill-conditioned and the recovered pose is arbitrary within a family.
  - `pure_rotation_risk`: the camera rotated without translating. There is no
    parallax, so there is no structure to recover, however good the matcher is.
    Distinguished from a planar scene by testing whether `K^-1 H K` is a rotation
    matrix -- which it is exactly under pure rotation, and is not when a plane is
    viewed from two positions. That test needs intrinsics, so this cue is OMITTED
    on an uncalibrated scene rather than guessed.

  **Both degeneracy numbers are fractions, and the fraction is not the actionable
  half.** The advice attached to them -- watch the seed, raise
  `init_min_angle_deg`, re-run `SceneLoader` over the translating subset -- needs
  to know WHICH pairs, and one pair in eleven and eleven in eleven are the same
  metric with different plans. So `degeneracy` carries `pair_planar` and
  `pair_pure_rotation` as boolean series beside their own pair indices, and the
  artifact note names the flagged pairs even when no diagnostic fires. The
  fractions are means of exactly these arrays; a caller wanting the fraction over
  a subset computes it rather than asking for a re-run.

  The indices are separate per series on purpose. A pair can admit a homography
  and no rotation estimate, and an uncalibrated scene fills the planar series and
  neither of the others, so one shared index would be a false claim about
  alignment. `motion.pair_rotation_deg` gained `rotation_pair_index` for the same
  reason: it was implicitly indexed by the full pair list, which is only correct
  when every pair fits.

  Reading this before choosing a matcher is the point. `planarity` on
  `pairwise_matches/v1` measures the same degeneracy AFTER a matcher has run on
  every pair; this measures it in seconds, before the choice.

  **This module emits numbers, not traits.** The `traits` group is derived by the
  orchestrator from thresholds in the global skills tier (deliberately unwritten
  so far -- see `evidence/INDEX`). The `healthy` bands here
  are this module's own advisory reading.

image: sfmstack/scene-motion:1.3.0
entrypoint: adapter:run
resources:
  gpu: true
  min_ram_gb: 8
  # Hint for ~40 consecutive pairs at the default 640px side. Flow is one forward
  # pass per pair; the model load dominates a cold start and is amortised by the
  # warm server.
  expected_duration_s: 60
  timeout_s: 3600

consumes:
  scene: {type: scene/v1, required: true}

produces:
  analysis: {type: scene_analysis/v1}

params:
  stride:
    type: integer
    default: 1
    minimum: 1
    description: Pairs are (i, i + stride) in scene order.
    tuning: >
      THE knob on this module. Flow between two nearly identical frames measures
      the sampling rate, not the capture: on a 60fps walkthrough every
      consecutive pair looks like a low-baseline failure and none of them is.
      Set stride to the spacing the reconstruction will actually match at. If
      low_baseline_risk is high and the capture is dense video, raise it before
      concluding anything.

  max_pairs:
    type: integer
    default: 60
    minimum: 1
    description: Cap on pairs evaluated. Pairs are subsampled uniformly when it binds.
    tuning: >
      Raise for a long sequence whose character changes partway through -- an
      indoor-to-outdoor walk -- where 60 uniformly spaced pairs may average two
      regimes into one meaningless middle.

  max_side:
    type: integer
    default: 640
    minimum: 128
    maximum: 2048
    description: Long edge the flow runs at.
    tuning: >
      Flow magnitudes are normalised by the image diagonal, so the motion scores
      are comparable across settings; runtime and memory are not. Raise toward
      1024 when the scene has fine structure whose motion is being averaged away,
      which shows up as an implausibly low overall_magnitude on a capture you
      know moved.

  flow_step:
    type: integer
    default: 8
    minimum: 1
    description: Grid spacing, in pixels, at which flow is sampled into correspondences.
    tuning: >
      Only affects the geometric tests (rotation and degeneracy), not the motion
      magnitudes, which use the dense field. Lower it for a scene whose textured
      area is a small part of the frame and the fits are landing on too few
      usable points.

  low_motion_thresh:
    type: number
    default: 0.005
    minimum: 0.0
    description: >
      Normalised p75 flow below which a pair counts toward `low_baseline_risk`.
    tuning: >
      A fraction of the image diagonal. 0.005 is roughly 6px on a 1024x768 frame.
      This is a threshold on a risk COUNT, not on the underlying measurement --
      move it only if the count is disagreeing with reconstructions you have
      already run on similar captures.

  # There was a `high_motion_thresh` here, feeding a `large_motion_risk` metric.
  # Both were cut on 2026-08-14 because the risk fraction fired on all ten
  # benchmark scenes measured, "every one of which reconstructs".
  #
  # THAT JUSTIFICATION WAS WRONG and is recorded here rather than quietly fixed.
  # No pipeline had been run at the time; the scenes were assumed to reconstruct
  # because they are standard benchmarks. Run to a sparse model, the highest-motion
  # captures do NOT fully reconstruct on a classical branch -- they drop between a
  # quarter and three quarters of their frames. The flag was reporting something
  # real and was cut for firing too often, which is a threshold complaint dressed
  # as a validity one.
  #
  # Not restored, because `high_motion_tail` carries the same measurement without
  # a cut welded into it and separates the fragmenting captures cleanly on its
  # own, and because `pair_p90` lets any consumer threshold it themselves. The
  # lesson is the one worth keeping: DO NOT CUT A METRIC FOR OVER-FIRING UNTIL THE
  # PIPELINE HAS BEEN RUN ON THE SCENES IT FIRED ON.

  rotation_risk_deg:
    type: number
    default: 20.0
    minimum: 0.0
    description: Pair rotation above which a pair counts toward `large_rotation_risk`.

  rotation_only_tol:
    type: number
    default: 0.15
    minimum: 0.0
    description: >
      How far `K^-1 H K` may sit from an orthogonal matrix, in Frobenius norm of
      `M M^T - I`, and still count as a pure rotation.
    tuning: >
      Tighten toward 0.05 to call pure rotation only on a near-exact match, which
      is the right direction if the flag is firing on scenes that reconstruct
      fine. Loosen toward 0.3 only with a noisy or badly-calibrated scene, where
      the residual has a floor unrelated to the camera's motion.

  ransac_threshold_px:
    type: number
    default: 1.5
    minimum: 0.1
    description: Inlier threshold for the homography and fundamental fits, in pixels
      at the flow resolution.

metrics:
  stride: 
    direction: neutral
    meaning: >
      The frame spacing these numbers were measured at. Published as a metric
      because two runs of this module at different strides appear in a plan brief
      under one module name, and every other number here means something different
      between them. A wide-stride run is NOT comparable to a stride-1 run or to any
      published band; it is read by its direction against the stride-1 run, and a
      LOWER reading means flow lost correspondence rather than that the camera moved
      less. See tuning.md#reading-a-wide-stride-run.

  n_pairs:
    direction: neutral
    meaning: Pairs on which flow was actually computed.

  fastest_pair:
    direction: neutral
    meaning: >
      The single fastest pair, as max over pairs of the p75 flow magnitude. Read it
      beside overall_magnitude: both that metric and high_motion_tail are MEDIANS
      over pairs, so a capture whose fast pairs are a minority cannot move either of
      them. That shape is common -- a slow traverse that turns a corner at the end,
      a site captured in two passes -- and this metric plus pair_p90_across are the
      only summary numbers that see it. A large gap between this and
      overall_magnitude means the capture is not homogeneous and the median is
      describing a capture that does not exist; go to pair_p75 and find out WHERE.

  pair_p90_across:
    direction: neutral
    meaning: >
      The 90th percentile ACROSS pairs of the p75 flow magnitude. Less brittle than
      fastest_pair to one bad flow fit, and the honest "tail" of the capture.
      high_motion_tail is a tail computed INSIDE each pair and then medianed, which
      is a different quantity and is not a substitute for this one.

  overall_magnitude:
    direction: neutral
    meaning: >
      Median over pairs of the p75 flow magnitude, as a fraction of the image
      diagonal. Apparent motion between ADJACENT frames. Neutral because both ends
      are failures: too little is no parallax, too much is no correspondence.

      A previous version of this note declined to put a band here on the grounds
      that the benchmark captures measured spanned the range and "all of which
      reconstruct". That was an assumption, not an observation, and running the
      pipeline refuted it: across fourteen captures taken to a sparse model, the
      HIGHEST readings are exactly the captures whose view graph fragments under a
      classical detector and ratio-test matcher, dropping between a quarter and
      three quarters of the frames, with a clean gap separating them from the
      captures that complete.

      The mechanism is that this measures adjacent-frame overlap, and a capture
      that covers ground quickly between adjacent frames shares proportionally
      less between NON-adjacent ones -- which is what an exhaustive view graph is
      built from. A fast capture is a sparse graph.

      Still no band declared, because the separating value is a property of the
      corpus rather than of the algorithm and n is small. But read a high value as
      a prediction that the graph will be sparse: plan exhaustive pairing, budget
      for a learned detector and matcher, and treat the cheap classical branch as
      something to verify rather than assume. See skills/plan/scene_to_pipeline.md.

  high_motion_tail:
    direction: neutral
    meaning: >
      Median over pairs of the p90 flow magnitude. How severe the fast regions
      are. Large while `overall_magnitude` is moderate means part of the frame is
      moving much faster than the rest -- a near object, or a dynamic one.

  variability:
    direction: lower_better
    healthy: [null, 0.035]
    meaning: >
      Interquartile range of the per-pair p75 flow. How uneven the capture rate
      is. High means one exposure interval is not like another, so a single
      pairing strategy will be wrong somewhere in the set.

  low_baseline_risk:
    direction: lower_better
    healthy: [null, 0.35]
    meaning: >
      Fraction of pairs below `low_motion_thresh`. Triangulation on these pairs is
      ill-conditioned -- the rays are nearly parallel, so depth is unconstrained
      however precise the correspondences are.

  # `large_motion_risk` was declared here and is gone. See the note in `params`.

  rotation_median_deg:
    direction: neutral
    meaning: >
      Median inter-frame rotation, from the essential matrix fitted to flow
      correspondences. Null on an uncalibrated scene, where there is no metric
      angle to report.

      IT DEGRADES EXACTLY WHERE IT IS BEING READ, AND IT UNDER-READS WHEN IT DOES.
      The angle comes from dense optical flow between the pair. Where the motion is
      large the flow loses correspondence on much of the frame, the essential
      matrix is fitted to whatever slow-moving region survived, and the recovered
      rotation is that region's -- which is smaller than the true one. Verified
      against a reconstruction on one capture: this metric read single digits with
      large_rotation_risk at zero, while the reconstructed poses put the median
      past twenty degrees with several pairs past sixty.

      SO TREAT IT AS A LOWER BOUND, and treat a LOW reading on a capture that looks
      fast as unproven rather than as reassurance. A high reading is trustworthy --
      flow that survived enough to fit a wide-angle essential matrix did survive.
      There is no confidence or correspondence-count field on this series to
      discount it with, which is a known gap. The only cheap corroboration
      available before a reconstruction exists is the matcher's per-pair match
      counts: a pair whose rotation is genuinely large loses matches, and one that
      this metric calls slow while the matcher barely pairs it is the case where
      this number is wrong.

  large_rotation_risk:
    direction: lower_better
    healthy: [null, 0.33]
    meaning: >
      Fraction of pairs rotating past `rotation_risk_deg`. Null when uncalibrated.

  planar_dominance:
    direction: lower_better
    healthy: [null, 0.5]
    meaning: >
      Fraction of pairs where GRIC prefers a homography to a fundamental matrix.
      High means essential-matrix decomposition is ill-conditioned across the set,
      and the fix depends on the cause -- see pure_rotation_risk.

  pure_rotation_risk:
    direction: lower_better
    healthy: [null, 0.1]
    meaning: >
      Fraction of pairs whose homography is a conjugated rotation, meaning the
      camera turned without translating and there is no structure to recover.
      Null on an uncalibrated scene: separating this from a planar scene requires
      intrinsics, and guessing would turn "cannot tell" into a wrong answer.

diagnostics:
  - code: low_baseline
    severity: warn
    message: Many pairs carry too little parallax to triangulate well.
    suggested_actions:
      - If the capture is dense video, raise `stride` and re-read before concluding anything.
      - If it is genuinely a narrow-baseline capture, expect high reprojection error at low triangulation angle.
      - Consider a capability that infers structure from a learned prior rather than by ray intersection - sfm_find_alternatives(produces='sparse_model/v1', not_consuming='poses/v1').
    metric: low_baseline_risk
    see_also: tuning.md#low_baseline_risk-above-035

  # There is no large-motion diagnostic. The metric it keyed on was cut; see the
  # note in `params`. Displacement without a rotation to corroborate it did not
  # predict anything on the scenes measured.

  - code: planar_scene
    severity: warn
    message: A homography explains the flow at least as well as a fundamental matrix.
    suggested_actions:
      - Read pure_rotation_risk next; a plane and a pure rotation look identical here and have different fixes.
      - If it is a genuine plane, essential-matrix pose is ill-conditioned; prefer a pose capability that does not decompose one.
      - Expect `planarity` on pairwise_matches/v1 to agree once a matcher has run.
    metric: planar_dominance
    see_also: limitations.md#planar-and-rotational-degeneracy-are-the-same-measurement

  - code: pure_rotation
    severity: error
    message: The camera rotated without translating on a substantial share of pairs.
    suggested_actions:
      - There is no parallax and therefore no structure; no matcher or triangulator recovers from this.
      - If only part of the capture is rotational, re-run SceneLoader over the translating subset.
    metric: pure_rotation_risk
    see_also: limitations.md#pure-rotation-is-terminal

  - code: uncalibrated_scene
    severity: info
    message: No intrinsics; rotation and pure-rotation cues are omitted.
    suggested_actions:
      - Motion magnitudes and planar_dominance are still valid - none of them need K.
      - Supply calibration_path to SceneLoader to recover the angular cues.
    see_also: limitations.md#what-needs-intrinsics

  - code: flow_fit_failed
    severity: info
    message: Some pairs produced too few usable correspondences for the geometric fits.
    suggested_actions:
      - Lower `flow_step` to sample the field more densely.
      - Expected on pairs that are almost entirely textureless or almost entirely static.
    see_also: limitations.md#what-needs-intrinsics
