name: SceneDescription
version: 0.7.0
kind: analysis
summary: >
  Renders a browsable contact sheet from the scene, then records what a viewer
  reports after looking at it. The only module whose output comes from outside
  the container.

description: |
  Half tool, half protocol, and worth understanding as such before using it.

  `SceneTriage` and `SceneMotion` compute. This one **prepares something to look
  at and then holds the answer**. The looking is done by whoever is driving --
  the module cannot do it, has no model, and does not pretend to.

  That makes it a two-call module:

    1. `sfm_run(SceneDescription, {scene})` with no `report`. It renders a
       contact sheet into the artifact and raises `awaiting_description`.
    2. `sfm_artifact_image(<that artifact>)` -- the sheet is the only image it
       carries, so no `name` is needed.
    3. **Three frames at full resolution, from the SCENE.** Two are fixed on
       every scene -- the first and last of the browse set -- and the
       `awaiting_description` diagnostic prints both calls with the names filled
       in. The third is the reader's own, any cell but those two, named and
       justified in the report's `third_frame` field.
    4. Fetch the rubric with `sfm_module_skill('SceneDescription', 'rubric')`.
       Answer it.
    5. `sfm_run(SceneDescription, {scene}, params={report: {...}})`. The report is
       validated against the rubric and written into the artifact.

  Both runs are kept, because ids come from the recipe and the report is part of
  it. That is not a wart: the un-described artifact is the record that the sheet
  was rendered, and two different readings of the same scene stay comparable
  through `sfm_compare`.

  **Why two frames are FIXED and the third is not.** The contact sheet is two
  downscales deep -- SceneLoader's, then the thumbnail's. On a 6200px ETH3D
  capture loaded at `resize=fixed 1024`, a 384px cell is 6% of the original
  linear scale and 0.4% of its pixels. Gloss, clipping, printed detail and fine
  texture are all decided below that, and several rubric fields ask about
  exactly those.

  Two are prescribed because a reader who picks all their own picks the
  interesting ones, and then no two scenes have been read the same way and
  nothing across scenes is comparable. First and last, every time.

  The third is free because fixity has a cost, and it was paid immediately: on
  ETH3D facade the scene's worst reflector -- a mirror-polished sculpture
  standing between camera and building -- appears only in cells [2] to [6], so
  under a two-frame protocol it could only be graded from a 384px thumbnail. One
  free choice recovers that without giving up the comparable base. It is not a
  loophole: the cell must be named as `[k]` in `third_frame`, must not be one of
  the two already prescribed, must resolve against the browse set, and must
  carry a reason. All four are checked.

  All three names are written into the artifact as `full_res_frames`, and the
  chosen index as the `third_frame` metric, so a second reader can repeat the
  reading exactly. Nothing here can verify that anyone looked.

  **What it is FOR.** Not general description -- the rubric targets the specific
  blind spots the two measuring modules document in their own `limitations.md`:

  | Blind spot | Which module admits it | Rubric field |
  | --- | --- | --- |
  | textureless area, but is it WANTED? | SceneTriage: "counts area, says nothing about where" | `empty_regions` |
  | repetition BETWEEN images, and whether it is PATTERN or OBJECTS | SceneTriage: "within-image self-similarity, not between-image ambiguity", and nothing counts objects at all | `repetition_notes` |
  | moving people, vehicles, water | both: "dynamic content ... not implemented" | `dynamic_content` |
  | reflective surfaces, and whether the reflection carries an IMAGE | measured nowhere | `material_hazards` |
  | where the reflector sits, which decides where the phantom lands | measured nowhere | `hazard_position` |
  | indoor or outdoor, for weight selection | nothing measured says which | `environment` |
  | whether there IS one thing being reconstructed | nothing counts objects | `main_subject` |
  | whether that thing even fits in the frames | nothing knows what the subject is | `subject_completeness` |

  A field that only restates a number the other modules already produce does not
  belong in the rubric. That is the test to apply when revising it.

  **`overall` is the field to act on.** It is a paragraph, it leads the artifact's
  narrative body, and it is what the driving agent should read alongside the
  `SceneTriage` and `SceneMotion` metrics when choosing a pipeline. The enums are
  its machine-readable shadow -- they make a hazard countable and a diagnostic
  possible; they do not carry the reasoning.

  **The report is asserted, not measured.** It goes into the `description` group
  of `scene_analysis/v1`, which is marked as such in the schema. It can be wrong
  in ways a measurement cannot.

image: sfmstack/scene-description:0.7.0
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 2
  # Decoding and downscaling a dozen images. The smallest module here.
  expected_duration_s: 10
  timeout_s: 900

consumes:
  scene: {type: scene/v1, required: true}

produces:
  analysis: {type: scene_analysis/v1}

params:
  n_images:
    type: integer
    default: 12
    minimum: 1
    maximum: 60
    description: How many images the browse set holds.
    tuning: >
      10-15 is the working range. Below that the sheet stops representing the
      capture; above it the cells get too small to see anything in, which is a
      worse failure because it is invisible -- the sheet still looks fine.

  sampling:
    type: string
    default: uniform
    enum: [uniform, head]
    description: How the browse set is drawn from the scene.
    tuning: >
      `uniform` spans the capture and is what you want for a description, because
      the question is what the whole set looks like. `head` shows a contiguous
      run, which is the right choice only when you are specifically checking how
      much consecutive frames differ.

  thumbnail_max_side:
    type: integer
    default: 384
    minimum: 64
    maximum: 1024
    description: Long edge of each cell in the contact sheet.
    tuning: >
      384 keeps a 12-cell sheet readable at a glance, and it is the value the
      published readings were made at -- changing it makes a reading
      incomparable with them, which is a bigger cost than it looks.

      Do not raise it to answer a question about fine detail. The sheet is
      already two downscales deep and 512 does not fix that; the full-resolution
      frames named in `awaiting_description` do, and they are part of the
      protocol rather than an escape hatch. Lower it only to fit a much larger
      `n_images` on one sheet, and expect to lose material and gloss entirely.

  grid_cols:
    type: integer
    default: 4
    minimum: 1
    maximum: 8
    description: Columns in the contact sheet.

  report:
    type: object
    default: {}
    description: >
      The answers to the rubric. Empty on the first call. See
      sfm_module_skill('SceneDescription', 'rubric') for the fields and how to
      answer them.
    tuning: >
      Not a tuning knob -- it is the payload. It is part of the recipe, so a
      revised reading produces a new artifact beside the old one rather than
      replacing it, and `sfm_compare` will show both.

metrics:
  described:
    direction: neutral
    meaning: >
      1 once a report has been supplied and validated, 0 for a browse-set-only
      run. The two are separate artifacts; this says which one you are holding.

  browse_images:
    direction: neutral
    meaning: Images in the contact sheet.

  dynamic_content:
    direction: lower_better
    healthy: [null, 0]
    meaning: >
      Moving objects -- people, vehicles, water, wind-blown foliage. NOTHING ELSE
      IN THIS STACK SEES THIS. Moving content corrupts tracks silently: the
      correspondences are real, the geometry is not, and every metric downstream
      looks healthy. 0 none, 1 minor, 2 substantial.

  material_hazards:
    direction: lower_better
    healthy: [null, 0]
    meaning: >
      Graded by COHERENCE, which is the mechanism: 0 none, 1 diffuse, 2 coherent.

      Does the reflective surface carry a legible IMAGE of something else? That
      is what decides which failure you get. A coherent reflection is a
      correspondence to a virtual point BEHIND the surface -- it triangulates
      confidently, reprojects beautifully, and can be a RANSAC inlier, so nothing
      downstream finds it. A diffuse highlight makes no virtual point at all; it
      makes a bright patch that moves with the camera instead of the surface, so
      correspondences there drift or drop out and that part of the model thins.
      Opposite responses, and the reader who goes hunting for phantom structure
      after a diffuse reading wastes the effort.

      Measured nowhere else in this system, at any level.

      This was graded by POSITION through v5 and regraded in v6. Position turned
      out to be a second, independent axis rather than a severity, and it is now
      `hazard_position`. The old rule also had no way to express a mirror standing
      between the camera and the subject -- the worst case, which it graded
      mildest -- and its "on the subject" test is undefined on a scene with no
      main subject, which is half the benchmark set.

  hazard_position:
    direction: neutral
    meaning: >
      Where the reflector sits, which decides where the phantom structure LANDS.
      0 background, 1 on_subject, 2 between_camera_and_subject, 3 throughout.
      Required whenever `material_hazards` is not `none`, refused when it is.

      Not a severity and not ordered as one, which is why the direction is
      neutral. Background usually means spurious points nobody is looking at.
      On_subject means they land on the surface you wanted. Between camera and
      subject is the dangerous one and the one the previous grading could not say:
      close to the camera, so the virtual points land well inside the model.

  third_frame:
    direction: neutral
    meaning: >
      Which browse cell the reader chose to open at full resolution, beyond the
      first and last which are opened on every scene. Not a quality score. It is
      here so a run of readings can be audited for where judgement keeps landing
      -- and, less comfortably, for whether it lands anywhere the fixed two do
      not already cover.

  has_main_subject:
    direction: neutral
    meaning: >
      1 when the images are of one identifiable thing, 0 when they are of a place
      or a collection with no single object at the centre of them. Not a quality
      score -- a scene shape. It decides whether "coverage" means covering an
      object or covering a volume, and nothing else in this system counts objects.

  subject_complete:
    direction: higher_better
    healthy: [1, null]
    meaning: >
      1 when the main subject sits fully inside the frames, 0 when it is cropped
      by the frame edge or occluded by something else. Null when there is no main
      subject, which is not the same as 0. This is what tells a reader that a low
      point count on part of the object is the CAPTURE's limit rather than the
      pipeline's.

diagnostics:
  - code: awaiting_description
    severity: info
    message: The browse set is rendered; no report has been supplied yet.
    suggested_actions:
      - 1. Look at the sheet - sfm_artifact_image(this artifact). It is the only image here, so no `name` is needed.
      - 2. Then the first and last of the browse set at FULL resolution, from the SCENE. This diagnostic prints both calls with the names filled in. Fixed, not chosen - the sheet's cells are two downscales deep and gloss, clipping and fine texture are not decidable there.
      - 3. Then ONE more cell of your choosing, for whatever those two do not settle. Name it as [k] in the report's `third_frame` field with a reason. It is checked against the browse set and may not be the first or last.
      - 4. Fetch the rubric with sfm_module_skill('SceneDescription', 'rubric').
      - 5. Re-run this module with params={report - the answers}. The two artifacts both persist.
    see_also: SKILL.md#the-two-call-flow

  - code: dynamic_content
    severity: warn
    message: Substantial moving content was reported in the images.
    metric: dynamic_content
    suggested_actions:
      - Nothing downstream detects this; tracks through a moving object are wrong and look right.
      - Prefer a subset of frames where the movers are absent, re-run SceneLoader over it.
      - Treat a healthy inlier_ratio as weak evidence here - moving points are locally consistent.
    see_also: limitations.md#the-report-can-be-wrong

  - code: coherent_reflection
    severity: warn
    message: A reflective surface carrying a legible reflected image was reported.
    metric: material_hazards
    suggested_actions:
      - A coherent reflection is a correspondence to a virtual point BEHIND the surface. Bundle adjustment will not remove it - measured, the flagged region's error ratio was unchanged to two decimals either side of a global solve.
      - BUT REPROJECTION ERROR IS NOT BLIND TO IT, and an earlier version of this action said it was. Point by point a virtual point does reproject well. As a POPULATION it does not - on a capture where the flagged surface was isolated in the finished cloud, those points carried 3.1x the mean reprojection error of the rest of the model (0.524px against 0.170px, medians 0.350 against 0.129). The distribution separates even though no single point looks wrong. Several readers stopped looking because this action told them not to.
      - So the probe is cheap and worth taking - segment the finished cloud and compare the error distributions, do not compare individual points. `p95_reprojection_error` beside `mean_reprojection_error` on sparse_model/v1 is the published version of that reading; a p95 far above the mean is a localised population of bad points, which is the shape this hazard makes.
      - Read `hazard_position` for where the phantom lands - between camera and subject is the worst, background is often ignorable.
      - Those features are self-consistent, so they can be RANSAC inliers. A healthy inlier_ratio is not evidence against this, and neither is a healthy MEAN.
    see_also: tuning.md#coherent-reflection

  - code: diffuse_reflection
    severity: info
    message: A glossy surface with no legible reflected image was reported.
    metric: material_hazards
    suggested_actions:
      - This is NOT the phantom-geometry case - a highlight with no image in it creates no virtual point. Do not go looking for structure in the wrong place.
      - Expect the opposite failure - a bright patch that moves with the camera rather than the surface, so correspondences there drift or drop out and that part of the model thins.
      - Read `hazard_position` for which part of the model is affected.
    see_also: limitations.md#the-report-can-be-wrong

  - code: incomplete_subject
    severity: info
    message: The main subject is not fully in view across the set.
    metric: subject_complete
    suggested_actions:
      - Judge downstream coverage against what is VISIBLE, not against the object.
      - '`cropped` is a framing limit of the capture; `occluded` means something else is in the way.'
      - Neither is a pipeline fault, and a low point count on the missing part is expected.
    see_also: limitations.md#the-report-can-be-wrong
