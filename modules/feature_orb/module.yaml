name: FeatureDetectionORB
version: 1.0.0
kind: detection
summary: >
  Oriented FAST keypoints with rotated BRIEF binary descriptors, optionally
  spatially suppressed with ANMS-SSC. CPU-only, very fast, patent-free.

description: |
  The cheap detector. An order of magnitude faster than SIFT and produces 32-byte
  binary descriptors matched by Hamming distance rather than 128 floats matched by
  L2, so the whole downstream matching cost drops with it.

  Use it when throughput matters more than robustness: long video sequences, a
  first look at a large capture, or any loop where you will run the pipeline many
  times. Its descriptors are genuinely weaker than SIFT's under scale and
  viewpoint change, which shows up as shorter tracks rather than as bad matches.

  ORB's real problem is not the descriptor, it is the spatial distribution. FAST
  fires in dense clusters on high-contrast texture and leaves the rest of the frame
  empty, and OpenCV's `nfeatures` cap keeps the highest-response corners, which
  makes the clustering worse. `suppression: ssc` applies Adaptive Non-Maximal
  Suppression via Square Covering, which selects a spatially even subset at the
  requested count. Turning it on is usually the difference between ORB being usable
  and not.

image: sfmstack/feature-orb:1.0.0
entrypoint: adapter:run
resources:
  gpu: false
  min_ram_gb: 4
  expected_duration_s: 20
  timeout_s: 1800

consumes:
  scene: {type: scene/v1, required: true}

produces:
  features: {type: features/v1}

params:
  max_keypoints:
    type: integer
    default: 4096
    minimum: 128
    maximum: 65536
    description: Cap per image.
    tuning: >
      ORB is cheap enough that raising this is nearly free compared to SIFT.
      8192-16384 is reasonable. But raising the cap without `suppression: ssc`
      mostly adds more keypoints to the same clusters -- check spatial_coverage
      rather than the count.

  suppression:
    type: string
    default: ssc
    enum: [none, ssc]
    description: Spatial suppression applied after detection.
    tuning: >
      Leave on `ssc`. ORB's default selection keeps the highest-response corners,
      which are concentrated exactly where texture is already strong. SSC selects a
      spatially even subset at the same count, which typically raises
      spatial_coverage substantially and costs a few milliseconds per image. Use
      `none` only to reproduce a bare OpenCV baseline.

  ssc_tolerance:
    type: number
    default: 0.1
    minimum: 0.01
    maximum: 0.5
    description: Relative tolerance on the SSC binary search for the count.
    tuning: >
      Rarely worth touching. Lower gets closer to exactly max_keypoints at the cost
      of more search iterations; the default lands within 10%.

  detect_multiplier:
    type: number
    default: 4.0
    minimum: 1.0
    maximum: 20.0
    description: Detect this many times max_keypoints before suppression.
    tuning: >
      SSC can only select from what was detected, so with a multiplier of 1 there
      is nothing to choose between and suppression does nothing. 3-5 gives it real
      choice. Higher costs detection time and helps little past ~5. Ignored when
      suppression is `none`.

  scale_factor:
    type: number
    default: 1.2
    minimum: 1.05
    maximum: 2.0
    description: Pyramid scale ratio between levels.
    tuning: >
      Smaller means finer scale sampling and better scale invariance at
      proportionally more cost. 1.2 with 8 levels covers roughly a 4x scale range.

  n_levels:
    type: integer
    default: 8
    minimum: 1
    maximum: 16
    description: Pyramid levels.
    tuning: >
      Raise together with scale_factor when the capture has large scale change --
      approaching and receding shots. Wide-baseline sets benefit more from this than
      from a higher keypoint cap.

  fast_threshold:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
    description: FAST corner intensity threshold. Lower detects more.
    tuning: >
      The knob for dim or low-contrast scenes, analogous to SIFT's
      contrast_threshold. Drop to 5-10 when keypoints_min is low. Below ~5 you are
      detecting sensor noise, which matches confidently and wrongly.

  edge_threshold:
    type: integer
    default: 31
    minimum: 3
    maximum: 100
    description: Border in pixels where no keypoints are detected.
    tuning: >
      Must be at least the patch size (31). Lower it only if the scene's useful
      content runs to the frame edge, which is unusual.

  wta_k:
    type: integer
    default: 2
    minimum: 2
    maximum: 4
    description: Points per BRIEF comparison. 2 gives Hamming, 3 or 4 need Hamming2.
    tuning: >
      Leave at 2. 3 and 4 produce descriptors requiring NORM_HAMMING2, which the
      matcher selects automatically from the artifact's `binary` flag, but they are
      slower and rarely better.

metrics:
  keypoints_per_image:
    direction: higher_better
    healthy: [500, null]
    meaning: Mean detections per image after suppression.
  keypoints_min:
    direction: higher_better
    healthy: [200, null]
    meaning: >
      Worst image in the set. One starved frame breaks every track through it, so
      this matters more than the mean.
  saturation:
    direction: neutral
    meaning: >
      Fraction of images that reached max_keypoints. Near zero means
      fast_threshold is binding rather than the cap.
  spatial_coverage:
    direction: higher_better
    healthy: [0.35, null]
    meaning: >
      Fraction of an 8x8 grid holding at least one keypoint. THE metric for ORB --
      it clusters far more than SIFT, and a thousand keypoints in one corner give a
      degenerate geometry however many there are.
  suppression_ratio:
    direction: neutral
    meaning: >
      Keypoints kept over keypoints detected. Near 1.0 means suppression had
      nothing to choose from; raise detect_multiplier.

diagnostics:
  - code: starved_frames
    severity: warn
    message: At least one image yielded very few keypoints.
    suggested_actions:
      - Lower fast_threshold toward 5-10.
      - Check whether those frames are blurred or largely textureless.
      - Consider SIFT; ORB degrades faster on low texture.
    see_also: tuning.md#keypoints_min-below-200

  - code: poor_coverage
    severity: warn
    message: Keypoints are concentrated in a small part of the frame.
    suggested_actions:
      - "Set suppression: ssc if it is off."
      - Raise detect_multiplier so suppression has more to choose from.
      - Lower fast_threshold to reach flatter regions.
    see_also: tuning.md#spatial_coverage-below-035

  - code: suppression_ineffective
    severity: info
    message: Suppression kept nearly everything it was given.
    suggested_actions:
      - Raise detect_multiplier; SSC can only select from what was detected.
    see_also: tuning.md#suppression_ratio-near-10

  - code: no_keypoints
    severity: error
    message: ORB detected nothing in any image.
    suggested_actions:
      - Lower fast_threshold.
      - Check the images decoded at all.
    see_also: limitations.md#when-orb-finds-nothing
