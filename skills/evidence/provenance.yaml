# Provenance sidecar: what every piece of context rests on. MACHINE-FACING.
#
# YAML, so sfm_workflow_skill never serves it; it changes no file it describes. A
# guidance paragraph is addressed by file#anchor plus a 12-hex sha256 of its own
# normalised text; a campaign section by the anchor the file already has. Three
# checks in tests/context_checks.py keep it current (drift, coverage, targets), and
# tools/build_context_view.py reads it to cut a reduced view for an ablation batch.
# tools/provenance_draft.py --merge regenerates the mechanical parts and keeps the
# hand-filled ones. Scene names are allowed here because this is the evidence tier.
#
# claims[].rests_on = "<campaign>#<anchor>" (the section) or "<campaign>" (whole);
# claims[].unsourced = why the paragraph is a definition, mechanism or procedure
# rather than a measurement. Exactly one of the two.
